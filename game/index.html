<title>좀비 생존 — 골격</title>
<style>
  /* WBS 1.1 골격. 외부 파일을 하나도 참조하지 않는다 (검사 C6). */
  :root {
    --void:   #05080A;   /* 레터박스 여백 */
    --ground: #12181A;
    --ink:    #DCE6E4;
    --muted:  #6F8180;
    --line:   #243335;
    --accent: #7FB0B2;
    --signal: #D9A24B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--void);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--void);
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #c {
    display: block;
    background: var(--ground);
    touch-action: none;
    image-rendering: pixelated;
  }
</style>

<div id="stage"><canvas id="c"></canvas></div>

<script>
"use strict";

/* =========================================================================
   상수 테이블 — WBS 1.4
   검사 c2_scope.py 가 이 선언들을 읽어 canon/10-scope.md 의 상한과 대조한다.
   상한을 늘리려면 instructions-log.md 에 지시를 남기고 사람이 정본을 고친다.
   ========================================================================= */

const SAVE_VERSION = 1;              // 저장 스키마 버전 (검사 C5). 실제 저장은 WBS 1.3
const ZONE_COUNT   = 10;             // 구역 수        (상한 10)
const TIER_MAX     = 3;              // 무기 등급 단계  (상한 3)
const MAX_ONSCREEN_ZOMBIES = 8;      // 동시 좀비 상한  (상한 8)

// 능력치 4종 (상한 4)
const STATS = [
  { id: 'atk',  name: '공격력',   base: 5,   growth: 1.12 },
  { id: 'spd',  name: '공격속도', base: 1.0, growth: 1.06 },
  { id: 'hp',   name: '최대체력', base: 100, growth: 1.10 },
  { id: 'reg',  name: '체력회복', base: 1,   growth: 1.08 }
];

// 무기 6종 (상한 6). 등급은 색만 바꾼다 — 스프라이트를 3배로 그리지 않는다.
const WEAPON_TYPES = [
  { id: 'pipe',      name: '쇠파이프',   mult: 1.00, tint: '#8A9BA0' },
  { id: 'rifle',     name: '소총',       mult: 1.45, tint: '#6F8FA8' },
  { id: 'shotgun',   name: '산탄총',     mult: 1.90, tint: '#A88C5F' },
  { id: 'flamer',    name: '화염방사기', mult: 2.60, tint: '#C4703A' },
  { id: 'crossbow',  name: '석궁',       mult: 3.40, tint: '#7E9B72' },
  { id: 'mine',      name: '지뢰',       mult: 4.50, tint: '#9A6B8E' }
];

/* =========================================================================
   레터박스 화면 맞춤 — WBS 1.1
   기준 비율은 하나뿐이다: 540 x 960 (9:16 세로).
   내부 좌표계는 항상 540x960. CSS 크기만 바꾼다.
   ========================================================================= */

const GAME_W = 540, GAME_H = 960;
const GAME_ASP = GAME_W / GAME_H;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let cssW = 0, cssH = 0, dpr = 1, lastTap = null;

function fitGame() {
  const stage = document.getElementById('stage');
  const vw = stage.clientWidth;
  const vh = stage.clientHeight;
  const winAsp = vw / vh;

  let w, h;
  if (winAsp > GAME_ASP) {   // 창이 더 넓다 -> 높이에 맞추고 좌우 필러박스
    h = vh; w = vh * GAME_ASP;
  } else {                   // 창이 더 좁다 -> 너비에 맞추고 상하 레터박스
    w = vw; h = vw / GAME_ASP;
  }
  cssW = Math.round(w);
  cssH = Math.round(h);

  // 화면 밀도. 발열을 막으려고 2배에서 자른다.
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width  = Math.round(GAME_W * dpr);
  canvas.height = Math.round(GAME_H * dpr);

  // 그리기 좌표는 언제나 540x960 논리 좌표로 유지한다.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  draw();
}

// 화면 픽셀 -> 캔버스 논리 좌표. getBoundingClientRect 를 쓰면 레터박스 여백이 자동 반영된다.
function toCanvas(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) / r.width  * GAME_W,
    y: (clientY - r.top)  / r.height * GAME_H
  };
}

/* =========================================================================
   화면 — 1.1 완료 판정용 확인 화면
   "폰 세로에서 잘림·여백 없이 꽉 참" 을 눈으로 확인할 수 있어야 한다.
   테두리와 네 모서리 표식이 다 보이면 잘리지 않은 것이다.
   ========================================================================= */

function draw() {
  ctx.clearRect(0, 0, GAME_W, GAME_H);

  // 바닥
  ctx.fillStyle = '#12181A';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  // 옅은 격자 — 찌그러졌는지 눈으로 본다 (정사각형이어야 한다)
  ctx.strokeStyle = 'rgba(127,176,178,0.07)';
  ctx.lineWidth = 1;
  for (let x = 60; x < GAME_W; x += 60) {
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, GAME_H); ctx.stroke();
  }
  for (let y = 60; y < GAME_H; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(GAME_W, y + 0.5); ctx.stroke();
  }

  // 바깥 테두리 — 한 변이라도 안 보이면 잘린 것이다
  ctx.strokeStyle = '#7FB0B2';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, GAME_W - 2, GAME_H - 2);

  // 네 모서리 표식
  ctx.strokeStyle = '#D9A24B';
  ctx.lineWidth = 3;
  const m = 26;
  const corners = [[0, 0, 1, 1], [GAME_W, 0, -1, 1], [0, GAME_H, 1, -1], [GAME_W, GAME_H, -1, -1]];
  for (const [cx, cy, sx, sy] of corners) {
    ctx.beginPath();
    ctx.moveTo(cx + sx * 4, cy + sy * (4 + m));
    ctx.lineTo(cx + sx * 4, cy + sy * 4);
    ctx.lineTo(cx + sx * (4 + m), cy + sy * 4);
    ctx.stroke();
  }

  // 제목
  ctx.textAlign = 'center';
  ctx.fillStyle = '#DCE6E4';
  ctx.font = '600 34px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText('좀비 생존', GAME_W / 2, 118);
  ctx.fillStyle = '#6F8180';
  ctx.font = '300 15px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText('WBS 1.1 골격 · 1.4 상수 테이블', GAME_W / 2, 146);

  // 화면 정보
  const rows = [
    ['기준 해상도', GAME_W + ' x ' + GAME_H + '  (9:16)'],
    ['캔버스 CSS', cssW + ' x ' + cssH + ' px'],
    ['배율', (cssW / GAME_W).toFixed(3) + ' x'],
    ['화면 밀도', 'DPR ' + dpr + '  (백버퍼 ' + canvas.width + ' x ' + canvas.height + ')'],
    ['창', window.innerWidth + ' x ' + window.innerHeight],
    ['방향', window.innerWidth >= window.innerHeight ? '가로 (좌우 필러박스)' : '세로 (꽉 참)']
  ];
  drawPanel('화면 맞춤', rows, 200);

  // 상수 테이블 — 1.4 가 실제로 들어갔는지 눈으로 확인
  const consts = [
    ['무기 종류', WEAPON_TYPES.length + ' / 상한 6'],
    ['능력치 종류', STATS.length + ' / 상한 4'],
    ['구역', ZONE_COUNT + ' / 상한 10'],
    ['무기 등급', TIER_MAX + ' / 상한 3'],
    ['동시 좀비', MAX_ONSCREEN_ZOMBIES + ' / 상한 8'],
    ['저장 버전', 'v' + SAVE_VERSION + '  (저장은 1.3)']
  ];
  drawPanel('스코프 상한', consts, 448);

  // 무기 6종 색 견본 — 등급은 색만 바꾼다는 설계를 눈으로 확인
  ctx.textAlign = 'left';
  ctx.fillStyle = '#6F8180';
  ctx.font = '600 12px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText('무기 6종', 46, 712);
  WEAPON_TYPES.forEach((w, i) => {
    const x = 46 + i * 75;
    ctx.fillStyle = w.tint;
    ctx.fillRect(x, 724, 62, 30);
    ctx.fillStyle = '#0B1012';
    ctx.font = '600 11px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(w.name, x + 31, 743);
    ctx.textAlign = 'left';
  });

  // 터치 확인 — 레터박스 배율이 반영됐는지
  ctx.textAlign = 'center';
  ctx.fillStyle = lastTap ? '#7FB0B2' : '#6F8180';
  ctx.font = '400 14px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText(
    lastTap ? ('터치 좌표  ' + lastTap.x.toFixed(0) + ', ' + lastTap.y.toFixed(0))
            : '화면을 눌러 좌표가 맞는지 확인',
    GAME_W / 2, 812
  );
  if (lastTap) {
    ctx.strokeStyle = '#D9A24B';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lastTap.x, lastTap.y, 14, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lastTap.x - 22, lastTap.y); ctx.lineTo(lastTap.x + 22, lastTap.y);
    ctx.moveTo(lastTap.x, lastTap.y - 22); ctx.lineTo(lastTap.x, lastTap.y + 22);
    ctx.stroke();
  }

  ctx.fillStyle = '#3E4F4E';
  ctx.font = '300 12px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText('테두리와 네 모서리가 모두 보이면 잘리지 않은 것이다', GAME_W / 2, GAME_H - 40);
}

function drawPanel(title, rows, top) {
  const x = 34, w = GAME_W - 68;
  const h = 34 + rows.length * 30;

  ctx.fillStyle = 'rgba(127,176,178,0.05)';
  ctx.fillRect(x, top, w, h);
  ctx.strokeStyle = 'rgba(127,176,178,0.22)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, top + 0.5, w - 1, h - 1);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#7FB0B2';
  ctx.font = '600 12px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText(title, x + 12, top + 22);

  rows.forEach((r, i) => {
    const y = top + 46 + i * 30;
    ctx.fillStyle = '#6F8180';
    ctx.font = '400 13px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
    ctx.fillText(r[0], x + 12, y);
    ctx.fillStyle = '#DCE6E4';
    ctx.font = '400 13px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(r[1], x + w - 12, y);
    ctx.textAlign = 'left';
  });
}

/* ========================= 이벤트 배선 ========================= */

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  lastTap = toCanvas(e.clientX, e.clientY);
  draw();
});

window.addEventListener('resize', fitGame);
window.addEventListener('orientationchange', () => setTimeout(fitGame, 80));
document.addEventListener('fullscreenchange', fitGame);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitGame);

fitGame();
</script>
