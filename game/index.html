   ========================================================================= */
var BUILD = '2026-09-09 · 지시 #38';

function fatal(what) {
  try {
    var d = document.getElementById('fatal');
    if (!d) {
      d = document.createElement('div');
      d.id = 'fatal';
      d.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:99;background:' + PALETTE.fatalBg + ';'

        + 'white-space:pre-wrap;word-break:break-all';
      document.body.appendChild(d);
    }
    d.textContent = '게임을 시작하지 못했다 (' + BUILD + ')\n\n' + what
      + '\n\n이 화면을 그대로 알려주면 원인을 찾을 수 있다.';
  } catch (e) { /* 여기서 또 죽으면 할 수 있는 게 없다 */ }
}

window.addEventListener('error', function (e) {
  fatal((e.message || '알 수 없는 오류') + '\n' + (e.filename || '') + ' ' + e.lineno + ':' + e.colno);
});

/* 파일이 잘리거나 문법 오류로 본 스크립트가 통째로 안 돌면 오류 이벤트조차 안 뜬다.

setTimeout(function () {

}, 1500);

   TIER_ODDS[뽑기 강화 단계][등급-1] = 퍼센트. **이 표가 코드가 쓰는 값이고, 확률 팝업은 이 표를 읽어 그린다** — 따로 적지 않는다.
   지시 #127 (2026-09-18 폰): "초반인데 전설·영웅이 너무 많이 나온다" → 0단계는 일반 70 · 고급 24 · 희귀 5 · 에픽 0.9 · 영웅 0.1, **전설은 Lv2 · 초월 Lv4 · 영원 Lv6 부터** 나온다.
   10단계: 일반 22 · 고급 28 · 희귀 22 · 에픽 14 · 영웅 8 · 전설 4 · 초월 1.5 · 영원 0.5. 위 등급일수록 늦게 붙는다(지수 2).
   값은 5단계(밸런스)에서 배터리로 맞춘다. 천장 없음(답 5). */
const GACHA_LV_MAX = 10;
const TIER_ODDS = [
  [ 70.0,  24.0,   5.0,   0.9,   0.1,   0.0,   0.0,   0.0],   // Lv 0
  [ 68.3,  24.4,   5.9,   1.2,   0.2,   0.0,   0.0,   0.0],   // Lv 1
  [ 65.8,  24.8,   7.1,   1.9,   0.4,   0.0,   0.0,   0.0],   // Lv 2
  [ 62.5,  25.2,   8.6,   2.8,   0.8,   0.1,   0.0,   0.0],   // Lv 3
  [ 58.7,  25.6,  10.2,   3.9,   1.4,   0.2,   0.0,   0.0],   // Lv 4
  [ 54.2,  26.0,  11.9,   5.2,   2.1,   0.6,   0.0,   0.0],   // Lv 5
  [ 49.0,  26.4,  13.8,   6.7,   2.9,   1.0,   0.2,   0.0],   // Lv 6
  [ 43.2,  26.8,  15.7,   8.3,   4.0,   1.6,   0.4,   0.0],   // Lv 7
  [ 36.8,  27.2,  17.7,  10.1,   5.2,   2.2,   0.7,   0.1],   // Lv 8
  [ 29.7,  27.6,  19.8,  12.0,   6.5,   3.1,   1.0,   0.3],   // Lv 9
  [ 22.0,  28.0,  22.0,  14.0,   8.0,   4.0,   1.5,   0.5]   // Lv 10
];
/* 뽑기 값 — 그 구역의 설계도 수입에 비례한다(설계도가 zoneIncome×BP_RATIO 로 크므로 값도 같이 커야 후반에 무한 뽑기가 안 된다).
   1회 = 최고 구역 한 구역의 설계도 수입 × GACHA_COST_FRAC. 10회는 10% 싸다. */
const GACHA_COST_FRAC = 0.5, GACHA_TEN_DISCOUNT = 0.9;
/* M6 3.1 뽑기 강화 — **부품**으로 올린다(답 4: 후반에 남아도는 부품의 쓸 곳). 단계 lv 의 값 = 최고 구역 한 구역의 부품 수입 × GACHA_UP_FRAC × GACHA_UP_G^lv.
   0~GACHA_LV_MAX(정본 '뽑기 강화' 행). 값은 5단계에서 배터리로 맞춘다(M6-B2: 후반 유휴 부품 절반 이하). */
const GACHA_UP_FRAC = 0.5, GACHA_UP_G = 1.6;
const OFFLINE_MAX_HOURS = 8;
const OFFLINE_RATE = 0.5;
const AD_BOOST_MIN = 10;

/* =========================================================================
   2. 화면 맞춤 — WBS 1.1
   기준 비율은 하나뿐이다: 540 x 960 (9:16). 내부 좌표계 고정, CSS 크기만 조절.
   ========================================================================= */

/* 가로 540 은 고정하고 **세로는 화면비에 맞춰 정한다.**
   9:16 으로 고정하면 18:9·19.5:9 폰에서 화면 세로의 16~20% 가 검은 여백이 된다
   (2026-09-09 7차 감사 지적). 이제 여백 없이 꽉 찬다.
   너무 납작하거나 너무 긴 화면에서는 아래 상한·하한에서 멈추고 그때만 레터박스가 생긴다. */
const GAME_W = 540;
/* 하한을 760 -> 720 으로 내렸다. 4:3 세로(=720)가 딱 들어가 태블릿·Surface Duo 의
   여백 5.2% 가 0 이 된다 (11차 감사 지적). 더 내리지 않는 이유: 664 아래로 가면
   사망 화면의 '광고 보고 부활' 버튼이 HUD 를 침범하고, 740 아래면 사망 문구가 HUD 에 닿는다.
   접는 폰 안쪽(649 필요)까지 채우려면 배치 자체를 다시 짜야 한다 — 그건 별도 작업이다. */
const MIN_GAME_H = 720;
const MAX_GAME_H = 1500;   // 21:9 폰(=1260)보다 넉넉하게
let GAME_H = 960;
let GAME_ASP = GAME_W / GAME_H;
const MAX_BACK_W = 2160;

const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
let cssW = 0, cssH = 0, backW = 0, backH = 0, dpr = 1;

function fitGame() {
  const stage = document.getElementById('stage');
  const vw = stage.clientWidth, vh = stage.clientHeight;

  // 화면비 그대로 세로를 잡는다. 상한·하한 안에서는 여백이 0 이 된다.
  GAME_H = Math.max(MIN_GAME_H, Math.min(MAX_GAME_H, Math.round(GAME_W * vh / Math.max(1, vw))));
  GAME_ASP = GAME_W / GAME_H;
  layout();

  let w, h;
  if (vw / vh > GAME_ASP) { h = vh; w = vh * GAME_ASP; }
  else                    { w = vw; h = vw / GAME_ASP; }
  cssW = Math.round(w); cssH = Math.round(h);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';

  /* 백버퍼는 실제로 표시되는 물리 픽셀 수로 잡는다 (지시 #12).
     DPR 을 3 으로 자르던 것을 없앴다. 자르면 DPR 4 기기(LG V30 = 1440x2880)에서
     백버퍼가 물리 픽셀의 **0.75배**가 되어 글자가 확대되어 그려진다.
     10차 감사가 deviceScaleFactor 4 를 실제로 걸고 잡았다 — 판정 ② 가 25% 미달이었고,
     그때까지 이 판정을 재던 방식(잘린 dpr 로 cssW*dpr 을 계산)은 **구조상 실패가 불가능**했다.
     상한은 MAX_BACK_W 하나로 남긴다. V30 은 360x4 = 1440 이라 상한 안이다. */
  dpr = window.devicePixelRatio || 1;
  backW = Math.round(cssW * dpr);
  if (backW > MAX_BACK_W) { backW = MAX_BACK_W; dpr = backW / cssW; }
  // 세로도 실제 CSS 높이에서 뽑는다. 비율로 계산하면 비정수 DPR 에서 물리픽셀이 어긋난다
  // (2026-09-08 2차 감사: 412x869 dpr 2.625 에서 2.5물리px 불일치)
  backH = Math.round(cssH * dpr);
  canvas.width = backW; canvas.height = backH;
  ctx.setTransform(backW / GAME_W, 0, 0, backH / GAME_H, 0, 0);
  ctx.imageSmoothingEnabled = false;   // M7 1.2 — 도트가 뭉개지지 않게. 크기가 바뀌면 기본값으로 돌아가므로 여기서
}

function toCanvas(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * GAME_W,
           y: (clientY - r.top) / r.height * GAME_H };
}

/* =========================================================================
   3. 저장 — WBS 1.3
   ========================================================================= */

const SAVE_KEY = 'zombie-idle-save';
let saveError = null;

function freshState() {
  return {
    v: SAVE_VERSION,
    parts: 0, plans: 0, zone: 1, kills: 0,
    lv: { atk: 0, spd: 0, hp: 0, reg: 0, inc: 0 },
    hp: 100,
    gachaLv: 0,                                // M6 3.1: 뽑기 강화 단계 (0~GACHA_LV_MAX)
    bestZone: 1, totalKills: 0,
    lastSeen: Date.now(),
    boostUntil: 0,
    /* M4 1 — 일일. day 는 "오늘" 의 날짜 번호, maxDay 는 본 적 있는 가장 큰 날짜(시계 되돌리기 방지) */
    gear: { weapon: { slot: 'weapon', type: 'pipe', tier: 1, affixes: [], zone: 1 } },   // M4 3: 부위 -> 장비. M6 2.3: 무기도 여기(처음은 쇠파이프)
    bag: [],                                   // M4 4: 아직 안 판 장비
    day: 0, maxDay: 0,
    quest: { zone: 0, up: 0, stage: 0 }, questTaken: {},
    login: { streak: 0, lastDay: -1 },
    keys: KEY_MAX
  };
}

let G = freshState();

function migrate(raw) {
  // 저장 구조가 바뀌면 여기서 옛 버전을 끌어올린다. 지금은 v1 하나뿐이다.
  if (!raw || typeof raw !== 'object') return freshState();
  /* v1 (M1) → v2 (M2): 구조는 같다. bestZone 이 없거나 zone 보다 작으면 채운다. 무기·구역이 늘어도 v1 진행을 잇는다.
     M1 실기 저장본이 여기로 들어온다 — 이걸 초기화하면 사람이 15분 플레이한 것이 날아간다. */
  if (raw.v === 1) { raw = Object.assign({}, raw, { v: 2, bestZone: Math.max(raw.bestZone || 1, raw.zone || 1) }); }
  /* v2 (M2) → v3 (M3): 설계도가 생겼다. 옛 저장본은 0 으로 시작한다 — 무기는 이미 가진 것을 잃지 않는다. */
  if (raw.v === 2) { raw = Object.assign({}, raw, { v: 3, plans: 0 }); }
  /* v3 (M3) → v4 (M4): 일일 리듬이 생겼다. 옛 저장본은 오늘부터 시작한다 — 진행은 하나도 안 잃는다. */
  if (raw.v === 3) {
    raw = Object.assign({}, raw, { v: 4, day: 0, maxDay: 0,
      quest: { zone: 0, up: 0, stage: 0 }, questTaken: {},
      login: { streak: 0, lastDay: -1 }, keys: KEY_MAX });
  }
  /* v4 (M4·M5) → v5 (M6): 무기가 장비가 됐다. owned/weapon 을 gear.weapon 과 가방으로 옮긴다 — 가진 무기를 하나도 안 잃는다.
     ★등급은 장비 등급으로 그대로 간다. */
  if (raw.v === 4) {
    const owned = raw.owned || { pipe: 1 }, cur = raw.weapon || 'pipe';
    const gear = Object.assign({}, raw.gear || {});
    const bag = (raw.bag || []).slice();
    if (!gear.weapon) gear.weapon = { slot: 'weapon', type: cur, tier: owned[cur] || 1, affixes: [], zone: raw.bestZone || 1 };   // 이미 장비 무기가 있으면 그대로
    for (const id of Object.keys(owned)) if (id !== cur && owned[id] > 0 && weaponOf(id))
      bag.push({ slot: 'weapon', type: id, tier: owned[id], affixes: [], zone: raw.bestZone || 1 });
    raw = Object.assign({}, raw, { v: 5, gear: gear, bag: bag, gachaLv: 0 });
    delete raw.owned; delete raw.weapon;
  }
  if (raw.v !== SAVE_VERSION) return freshState();
  const s = freshState();
  for (const k of Object.keys(s)) if (k in raw) s[k] = raw[k];
  if (!s.gear || !s.gear.weapon) s.gear = Object.assign({}, s.gear || {}, freshState().gear);   // 무기 칸은 비지 않는다
  /* 옛 저장본에는 inc 가 없다. 0 으로 채운다 — 그래서 SAVE_VERSION 을 올리지 않는다. */
  s.lv = Object.assign({ atk: 0, spd: 0, hp: 0, reg: 0, inc: 0 }, raw.lv || {});
  return s;
}

function save() {
  if (resetting) return;                    // 저장 지우기 중 — 새로고침 전에 자동 저장이 옛 G 를 다시 쓰던 것 (2026-09-17 브라우저 확인)
  G.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); saveError = null; }
  catch (e) { saveError = String(e); }   // 조용히 넘기지 않는다. HUD에 표시한다
}

/* 불러오기 실패는 따로 담는다. saveError 에 담으면 바로 뒤 start() 의 save() 가
   성공하면서 null 로 지워져, **진행이 통째로 초기화됐는데 화면에 아무 표시가 안 남는다**
   (2026-09-09 10차 감사 적발. 사례 '조용한실패' 와 같은 종류다).
   여기에는 화면에 띄울 문구를 그대로 담는다. */
let loadError = null;

function load() {
  try {
    const t = localStorage.getItem(SAVE_KEY);
    if (!t) return false;
    const raw = JSON.parse(t);
    /* 버전이 다르면 migrate() 가 처음 상태로 되돌린다. 그것도 진행이 통째로 사라지는 일인데
       11차 감사까지 아무 표시가 없었다 — 위 결함과 같은 종류가 이 경로에 남아 있었다.
       지금은 SAVE_VERSION 이 1뿐이라 안 터질 뿐이다. */
    /* M2: v1 은 migrate() 가 v2 로 끌어올린다 — 초기화가 아니므로 문구를 띄우지 않는다.
       (브라우저 시험에서 v1 저장본이 진행은 그대로인데 "처음부터 시작한다" 를 띄웠다 — 거짓 경고) */
    if (raw && typeof raw === 'object' && raw.v !== SAVE_VERSION && raw.v !== 1 && raw.v !== 2 && raw.v !== 3 && raw.v !== 4) {
      loadError = '저장 형식이 바뀌어 처음부터 시작한다';
    }
    G = migrate(raw);
    flushBag();                                // M6 재설계: 가방은 없다 — 있던 것은 판다
    return true;
  } catch (e) { loadError = '저장본이 깨져 처음부터 시작한다'; G = freshState(); return false; }
}

/* =========================================================================
   4. 파생 수치
   ========================================================================= */

function statDef(id) { return STATS.find(x => x.id === id); }
function statOf(id) {
  const s = statDef(id), lv = G.lv[id] || 0;
  // M6 1.2 — add 가 있으면 더하기 성장(기본 + add×레벨), 없으면 곱하기 성장. 장비 옵션(M4 3)은 둘 다 곱한다. cap 은 최종값 상한.
  const v = (s.add != null ? s.base + s.add * lv : s.base * Math.pow(s.growth, lv)) * gearMult(id);
  return s.cap != null ? Math.min(s.cap, v) : v;
}
function statNext(id) {   // 한 레벨 뒤 값 (줄 부제용)
  const s = statDef(id), lv = (G.lv[id] || 0) + 1;
  const v = (s.add != null ? s.base + s.add * lv : s.base * Math.pow(s.growth, lv)) * gearMult(id);
  return s.cap != null ? Math.min(s.cap, v) : v;
}
function statText(id, v) { const s = statDef(id); return s.pct ? Math.round(v * 100) + '%' : fmt(v) + s.unit; }
function statCost(id) { const s = statDef(id); return Math.ceil(s.cost0 * Math.pow(s.costG, G.lv[id] || 0)); }
function weaponOf(id) { return WEAPON_TYPES.find(w => w.id === id); }
/* M6 2.3 — 낀 무기는 장비다(G.gear.weapon). 없을 수는 없지만(freshState·migrate 가 채운다) 방어한다. */
function curWeapon() { return (G.gear && G.gear.weapon) || { slot: 'weapon', type: 'pipe', tier: 1, affixes: [], zone: 1 }; }
function weaponPower() {
  const cw = curWeapon(), w = weaponOf(cw.type) || WEAPON_TYPES[0];
  return w.mult * tierPower(cw.tier);
}
let lastHitCrit = false;   // M6 1.2 — 마지막 hitDamage 가 치명타였는지 (피해 글자 크기용)
function hitDamage() {
  const base = statOf('atk') * weaponPower();
  lastHitCrit = Math.random() < Math.min(1, statOf('crit'));
  return lastHitCrit ? base * statOf('cdmg') : base;
}
/* 기대값 — HUD 의 DPS 와 자(시뮬)가 쓴다. 굴리지 않는다. */
function expectedHit() { const p = Math.min(1, statOf('crit')); return statOf('atk') * weaponPower() * (1 + p * (statOf('cdmg') - 1)); }
function attacksPerSec() { return statOf('spd') * (focusActive() ? FOCUS_MULT : 1); }   // M4 2: 집중 사격
function playerDPS() { return expectedHit() * attacksPerSec(); }   // M6 1.2: 기대값 — 굴리지 않는다
function maxHP() { return statOf('hp'); }
function regenPerSec() { return statOf('reg'); }

function zoneHP(z) { return ZONE_HP0 * Math.pow(ZONE_HP_G, z - 1); }
function zoneDPS(z) { return zoneHP(z) * ZOMBIE_DPS_RATIO; }
function zoneKills(z) { return KILLS_PER_ZONE * ((z >= WALL_START && z % WALL_EVERY === 0) ? WALL_KILL_MULT : 1); }   // M2 벽: 처치 수만 늘어난다
function zoneReward(z) { return ZONE_RW0 * Math.pow(ZONE_RW_G, z - 1) * KILLS_PER_ZONE / zoneKills(z); }   // M2 벽: 처치당 보상 ÷2 — 벽의 총수입은 보통 구역과 같다 (M2-B2‴, 지시 #63)
/* =========================================================================
   3.5 장비 생성기 — M4 3.3
   구역이 깊을수록 높은 등급이 잘 나온다. **정해진 목록이 아니라 뽑는다** — 조사 ① 의 핵심.
   난수는 `Math.random()` 만 쓴다 — 포트가 LCG 를 심어 같은 수열을 따라온다 (12차 감사 교훈).
   ========================================================================= */

/* 구역 z 에서 등급 분포. 중심이 구역과 함께 오르고, 위아래로 흩어진다.
   반환은 1..TIER_MAX. */
function rollTier(z) {
  const center = 1 + (TIER_MAX - 1) * Math.min(1, (z - 1) / (ZONE_COUNT - 1));
  const spread = 1.6;
  let t = Math.round(center + (Math.random() + Math.random() + Math.random() - 1.5) * spread);
  return Math.max(1, Math.min(TIER_MAX, t));
}

/* 장비 하나를 뽑는다. slot 을 안 주면 부위도 뽑는다(무기 부위 제외 — 무기는 상점에서 산다). */
function rollGear(z, slotId, tierGiven) {
  /* M6 2.2 — slotId 없으면 5부위 중 랜덤(무기 포함). tierGiven 이 있으면(뽑기) 그 등급, 없으면 구역 기준 rollTier. */
  const slot = slotId ? GEAR_SLOTS.find((s) => s.id === slotId)
                      : GEAR_SLOTS[Math.floor(Math.random() * GEAR_SLOTS.length)];
  const tier = tierGiven || rollTier(z);
  const shape = Math.floor(Math.random() * GEAR_SHAPES);
  if (slot.id === 'weapon') {
    // 무기 종류는 **해금된 것 중** 랜덤 — 해금 구역은 "뽑기 풀에 들어오는 구역" (정본 무기 종류 행)
    const pool = WEAPON_TYPES.filter(weaponUnlocked);
    const w = pool[Math.floor(Math.random() * pool.length)];
    const nAffW = Math.min(GEAR_AFFIXES, Math.random() < (tier - 1) / (TIER_MAX - 1) ? 2 : 1);
    const poolA = AFFIX_DEFS.slice(), affW = [];
    for (let i = 0; i < nAffW && poolA.length; i++) {
      const d = poolA.splice(Math.floor(Math.random() * poolA.length), 1)[0];
      affW.push({ id: d.id, mult: 1 + d.per * Math.pow(AFFIX_TIER_MULT, tier - 1) * (0.7 + Math.random() * 0.6) });
    }
    return { slot: 'weapon', type: w.id, tier: tier, affixes: affW, zone: z };
  }
  /* 옵션 줄 수 — 등급이 높을수록 두 줄이 잘 붙는다. 상한은 정본의 GEAR_AFFIXES. */
  const nAff = Math.min(GEAR_AFFIXES, Math.random() < (tier - 1) / (TIER_MAX - 1) ? 2 : 1);
  const pool = AFFIX_DEFS.slice();
  const affixes = [];
  for (let i = 0; i < nAff && pool.length; i++) {
    const k = Math.floor(Math.random() * pool.length);
    const d = pool.splice(k, 1)[0];
    affixes.push({ id: d.id, mult: 1 + d.per * Math.pow(AFFIX_TIER_MULT, tier - 1) * (0.7 + Math.random() * 0.6) });
  }
  return { slot: slot.id, shape: shape, tier: tier, affixes: affixes, zone: z };
}

/* 장비의 값어치 — 판매가와 비교에 쓴다. 등급이 지배하고 옵션이 보탠다. */
function gearScore(g) {
  if (!g) return 0;
  /* M6 2.3 — 무기의 값어치는 **위력**(종류 배수 × 등급 배수)이다. 등급만 보면 영웅 쇠파이프(×3.0)가 일반 지뢰(×4.5)보다 "좋다" 고 잘못 말한다
     (브라우저에서 그렇게 나왔다, 2026-09-18). 방어구는 등급이 곧 값어치(2.1^(등급-1)). 같은 부위끼리만 견준다. 팔 값은 gearSellPrice 가 따로. */
  let v = g.slot === 'weapon' ? (weaponOf(g.type) || WEAPON_TYPES[0]).mult * tierPower(g.tier) : Math.pow(2.1, g.tier - 1);
  for (const a of g.affixes) v *= a.mult;
  return v;
}

/* 장착 중인 장비가 주는 능력치 배수. 없으면 1. */
function gearMult(statId) {
  let m = 1;
  for (const s of GEAR_SLOTS) {
    const g = (G.gear || {})[s.id];
    if (!g) continue;
    for (const a of g.affixes) if (a.id === statId) m *= a.mult;
  }
  return m;
}

/* M6 재설계 (지시 #127, 버섯커식) — **가방이 없다.** 뽑은 것은 낀 것과 견줘 낀다(벗은 것은 판다) 아니면 판다.
   M4 4.2 의 자동 판매 기준·가방 넘침 규칙은 여기서 끝났다(그 손잡이는 M5 2.4 에서 처음 생겼다가 하루 만에 사라졌다 — 로그 #127). */
/* 판매가 — 부품. 그 구역 총수입에 견줘 매긴다. 등급이 높을수록 값이 뛴다.
   M6 5.3 (지시 #132): 계수를 상수로 뺐다 — 거울이 이 값을 읽는다. 전엔 거울 파이썬에 0.09 가 따로 적혀 있어 0.10·0.11 로 올린 것이 측정에 안 들어갔다(사례 27). */
const SELL_PRICE_FRAC = 0.11;   // 0.09 → 판매 비중 14.1% (선 15%)
function gearSellPrice(g) {
  return zoneIncome(g.zone || G.zone) * SELL_PRICE_FRAC * Math.pow(1.55, g.tier - 1) * statOf('inc');   // M4 4.1: 0.05 는 판매 비중이 21.8% 였다 (선 30%)
}
function sellGear(g) { const v = gearSellPrice(g); G.parts += v; return v; }
/* 새 장비를 낀다. 그 부위에 있던 것은 판다(부품). 판 값을 돌려준다(없었으면 0). */
function equipNew(g) {
  if (!G.gear) G.gear = {};
  const old = G.gear[g.slot];
  G.gear[g.slot] = g;
  return old ? sellGear(old) : 0;
}
/* 옛 저장(가방이 있던 M4~M6 초기)의 가방은 전부 판다 — 잃는 게 아니라 부품이 된다. */
function flushBag() {
  if (!G.bag || !G.bag.length) return 0;
  let v = 0; for (const g of G.bag) v += sellGear(g);
  G.bag = []; return v;
}

function affixText(a) {
  const d = AFFIX_DEFS.find((x) => x.id === a.id);
  return (d ? d.name : a.id) + ' +' + Math.round((a.mult - 1) * 100) + '%';
}

function gearName(g) {
  const slot = GEAR_SLOTS.find((s) => s.id === g.slot);
  const nm = g.slot === 'weapon' ? ((weaponOf(g.type) || WEAPON_TYPES[0]).name)
           : (slot && slot.shapes ? slot.shapes[g.shape % GEAR_SHAPES] : (slot ? slot.name : '장비'));
  return tierName(g.tier) + ' ' + nm;
}

/* ── M6 2.2 뽑기 ── */
function rollTierOdds(lv) {
  const row = TIER_ODDS[Math.max(0, Math.min(GACHA_LV_MAX, lv || 0))];
  let r = Math.random() * 100;
  for (let i = 0; i < row.length; i++) { r -= row[i]; if (r < 0) return i + 1; }
  return row.length;
}
function gachaRoll() { return rollGear(G.bestZone || 1, null, rollTierOdds(G.gachaLv)); }
function gachaCost(n) {
  const one = zoneIncome(G.bestZone || 1) * BP_RATIO * GACHA_COST_FRAC * statOf('inc');
  return Math.ceil(n === 10 ? one * 10 * GACHA_TEN_DISCOUNT : one * n);
}
/* 결과 팝업.  1회: { mode:'one', g, cur, done:null|'equip'|'sell', sold }  — 사람이 장착/판매를 고른다 (빈 부위면 바로 낀다).
              10회: { mode:'ten', items:[{ g, r:'equip'|'sell', gain }], gain } — 더 좋으면 낀다(벗은 것은 판다), 아니면 판다. 버섯커의 10연 자동 처리. */
let gachaResult = null;
let oddsPopup = false;    // M6 3.2 — 확률 팝업. TIER_ODDS[G.gachaLv] 를 그대로 그린다
function gachaUpCost(lv) { return Math.ceil(zoneIncome(G.bestZone || 1) * GACHA_UP_FRAC * Math.pow(GACHA_UP_G, lv) * statOf('inc')); }
function upgradeGacha() {
  const lv = G.gachaLv || 0;
  if (lv >= GACHA_LV_MAX) return false;
  const c = gachaUpCost(lv);
  if (G.parts < c) return false;
  G.parts -= c; G.gachaLv = lv + 1;
  questProgress('up', 1);                       // M4 1.2 — 강화도 업그레이드다
  return true;
}
function oddsTop(lv) { const r = TIER_ODDS[Math.max(0, Math.min(GACHA_LV_MAX, lv))]; return r[4] + r[5] + r[6] + r[7]; }   // 영웅~영원 합
function pullGacha(n) {
  const cost = gachaCost(n);
  if ((G.plans || 0) < cost) return false;
  G.plans -= cost;
  questProgress('up', n);                       // M4 1.2 과제 '업그레이드' — 무기 구매가 세던 자리를 뽑기가 잇는다
  if (n === 1) {
    const g = gachaRoll(), cur = (G.gear || {})[g.slot];
    if (!cur) { equipNew(g); gachaResult = { mode: 'one', g: g, cur: null, done: 'equip', sold: 0 }; }
    else gachaResult = { mode: 'one', g: g, cur: cur, done: null, sold: 0 };
    return true;
  }
  const items = []; let gain = 0;
  for (let i = 0; i < n; i++) {
    const g = gachaRoll(), cur = (G.gear || {})[g.slot];
    if (!cur || gearScore(g) > gearScore(cur)) { const v = equipNew(g); items.push({ g: g, r: 'equip', gain: v }); gain += v; }
    else { const v = sellGear(g); items.push({ g: g, r: 'sell', gain: v }); gain += v; }
  }

  return true;

/* 1회 팝업의 두 버튼 */
function gachaDecide(what) {
  const r = gachaResult; if (!r || r.mode !== 'one' || r.done) return false;
  r.sold = what === 'equip' ? equipNew(r.g) : sellGear(r.g);
  r.done = what; save();
  return true;
}
function stageKills(z) { return Math.max(1, Math.round(zoneKills(z) / STAGES_PER_ZONE)); }
function killReward(z) { return zoneReward(z); }   // M3 5: 단계 보상이 설계도로 옮겨가 부품은 분할 전 그대로
function zoneIncome(z) { return zoneReward(z) * zoneKills(z); }
function stageBlueprint(z) { return zoneIncome(z) * BP_RATIO * BP_STAGE_SHARE / (STAGES_PER_ZONE - 1); }
function bossBlueprint(z) { return zoneIncome(z) * BP_RATIO * BP_BOSS_SHARE; }
function currentStage() { return Math.min(STAGES_PER_ZONE, Math.floor(killIndex / stageKills(G.zone)) + 1); }
function isBossKill(z, idx) { return (z % BOSS_EVERY === 0) && idx === zoneKills(z) - 1; }
function weaponUnlocked(w) { return (w.unlock || 1) <= (G.bestZone || 1); }   // M2: 해금 구역은 최고 도달 구역 기준
/* M6 2.3 — weaponUpgradeCost·buyWeapon·equip 은 없어졌다. 무기는 뽑기에서 나오고 가방에서 낀다(equipGear). */
/* 무기 등급을 색으로 보인다. 정본: "등급은 색만 바꾼다 (recolor)".
   등급이 오를수록 밝고 진해진다. 스프라이트를 3배로 그리지 않는다.
   2026-09-08 검증자 적발: tier 가 색 계산에 쓰이는 곳이 0곳이었다. */
/* M4 3 — 등급이 3 → 8 이 되면서 색 계산을 **등급 수에 맞춰 일반화**했다.
   전에는 2·3 을 손으로 적어 뒀다. 정본이 등급 수를 바꾸면 여기가 따라온다 — 숫자를 두 곳에 안 적는다. */
function tierTint(hex, tier) {
  const t = Math.max(1, Math.min(TIER_MAX, tier || 1));
  if (t === 1) return hex;
  const k = (t - 1) / Math.max(1, TIER_MAX - 1);   // 0 ~ 1
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const lift = 0.62 * k;                       // 밝게
  const warm = 30 * k * k;                     // 높은 등급일수록 금빛
  r = Math.min(255, Math.round(r + (255 - r) * lift + warm));
  g = Math.min(255, Math.round(g + (255 - g) * lift + warm * 0.6));
  b = Math.min(255, Math.round(b + (255 - b) * lift * 0.7));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const TIER_NAMES = ['일반', '고급', '희귀', '에픽', '영웅', '전설', '초월', '영원'];   // 2026-09-18 지시 #118: 정교→희귀, 희귀→에픽 (사람이 정했다)
/* M5 2.5 — 목록·띠·알림의 등급 색. 전투 화면의 무기 모양은 weaponTint(무기 고유색+밝기)를 그대로 쓴다 — 무기마다 다른 색이 무기를 알아보는 단서라서. */
function tierColor(t) { return PALETTE.tier[Math.max(1, Math.min(TIER_MAX, t || 1)) - 1]; }
function tierName(t) { return TIER_NAMES[Math.max(1, Math.min(TIER_MAX, t)) - 1] || ('등급 ' + t); }
function weaponTint() { const cw = curWeapon(); return tierTint((weaponOf(cw.type) || WEAPON_TYPES[0]).tint, cw.tier); }   // M6 2.3: 낀 무기 기준

function boostActive() { return Date.now() < (G.boostUntil || 0); }
function rewardMult() { return boostActive() ? 2 : 1; }

/* =========================================================================
   5. 숫자 표기 — WBS 7.3
   ========================================================================= */

const SUFFIX = ['', 'K', 'M', 'B', 'T', 'aa', 'ab', 'ac'];
function fmt(n) {
  if (!isFinite(n)) return '무한';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return (n < 10 && n % 1 !== 0) ? n.toFixed(1) : String(Math.floor(n));
  let i = 0;
  while (n >= 1000 && i < SUFFIX.length - 1) { n /= 1000; i++; }
  let t = n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0);
  // 반올림이 1000 을 넘기면 한 단계 더 올린다.
  // 이게 없으면 999999 가 '1000K' 로 나온다 (2026-09-08 검증자 적발)
  if (parseFloat(t) >= 1000 && i < SUFFIX.length - 1) { i++; t = (parseFloat(t) / 1000).toFixed(2); }
  if (t.indexOf('.') >= 0) t = t.replace(/\.?0+$/, '');   // 49.0K -> 49K
  return t + SUFFIX[i];
}
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return h + '시간 ' + m + '분';
  if (m) return m + '분 ' + s + '초';
  return s + '초';
}

/* =========================================================================
   6. 전투 — WBS 2

/* 패널을 키워 터치 대상을 넓혔다. 검증자: 무기 행 높이가 5.1mm 로 너무 작았다 */

   화면이 길어지면 그 사이의 전투 영역이 늘어난다. */
const HUD_H = 100;
/* 패널 높이를 **화면 세로에 비례**시킨다 (지시 #51).
   420 으로 고정했더니 목록 높이가 어느 기기에서나 278px 로 같아서
   **긴 폰에서도 4줄만 보였다** — 남는 높이를 전투 영역이 전부 먹었다.
   ARENA_MIN 은 전투 영역이 최소한 확보해야 하는 높이다. 식으로 세운다:
   좀비 머리가 ARENA_TOP 아래에 있어야 한다 → GROUND_Y - 40 ≥ ARENA_TOP → 전투 영역 ≥ 92.
   부활 제안 버튼(ARENA_BOT - 70)도 ARENA_TOP 아래여야 한다 → 전투 영역 ≥ 70.
   둘 중 큰 92 에 여유를 얹어 150 으로 둔다.

    10 위라는 것을 빼먹었기 때문이다. 아래 식에 그 10 을 넣었다.) */
const PANEL_H_MIN = 420;
const PANEL_H_MAX = 620;
const PANEL_H_RATIO = 0.46;
const ARENA_MIN = 150;
let PANEL_H = PANEL_H_MIN;
const ARENA_TOP = HUD_H;
/* **layout() 보다 먼저 선언한다.** layout() 이 바닥선 변화만큼 좀비를 옮기는데,
   선언이 뒤에 있으면 맨 처음 layout() 호출에서 TDZ 로 죽는다 —
   `typeof zombies` 는 let 의 TDZ 를 막아주지 않는다.
   지시 #51 에서 패널 높이를 계산으로 바꾸자 첫 호출부터 dy != 0 이 되어 실제로 터졌다.
   **검사 17/17 이 전부 통과한 상태였고, 브라우저로 열어서야 드러났다.** */

// 횡이동. 생존자는 왼쪽에서 오른쪽을 보고 서 있고, 좀비는 오른쪽 화면 밖에서 걸어온다 (지시 #14)

let spawnTimer = 0, attackTimer = 0, killIndex = 0;
/* M4 2 — 집중 사격. **저장하지 않는다.** 껐다 켜면 초기화되지만 공짜 가속이라 손해가 없다.

function damageZombie(z, dmg) {
  z.hp -= dmg; z.flash = 0.12;
  addFloat(z.x, z.y - 14, (lastHitCrit ? '★' : '') + fmt(dmg), lastHitCrit ? PALETTE.gold : (z.boss ? PALETTE.bossHit : PALETTE.ink), lastHitCrit ? 17 : 13);   // M6 1.2 치명타는 크게·금색
  if (z.hp <= 0) killZombie(z);
}

/* 초과 피해를 앞줄 다음 좀비에게 넘긴다.
   넘기지 않으면 마지막 타격의 남는 피해가 버려져 실제 처치 속도가 표시 DPS 보다 느려진다
   (2026-09-09 6차 감사: 구역10 에서 타격당 674 로 HP 775 를 2타에 잡아 42.5% 낭비, 표시 DPS 대비 -37.60%). */
/* 화면에 좀비가 다 죽고도 피해가 남으면 **버리지 않고 들고 있다가 다음 좀비에게 얹는다.**
   2026-09-10 지시 #52 실측: 이 버림이 표시 DPS 의 **0.54%** 였다. 남는 양은 한 타격을 못 넘는다.
   (같은 측정에서 구역 전환 버림은 0.00%, 표적 없는 시간은 0.02% 로 영향이 없었다.) */
let dmgBank = 0;

function applyDamage(dmg) {
  let left = dmg + dmgBank, guard = 0;
  dmgBank = 0;
  while (left > 1e-9 && zombies.length && guard++ < MAX_ONSCREEN_ZOMBIES + 2) {
    let target = null, best = 1e9;
    for (const z of zombies) { if (z.x < best) { best = z.x; target = z; } }
    if (!target) break;
    const take = Math.min(left, target.hp);
    left -= take;
    damageZombie(target, take);
  }
  if (left > 1e-9) dmgBank = left;
}

function killZombie(z) {
  const i = zombies.indexOf(z);
  if (i < 0) return;
  zombies.splice(i, 1);
  for (let k = 0; k < (z.boss ? 16 : 7); k++) {
    particles.push({ x: z.x, y: z.y, vx: (Math.random() - .5) * 120,
      vy: (Math.random() - .5) * 120 - 30, life: .5 + Math.random() * .3,
      t: 0, c: z.boss ? PALETTE.gold : PALETTE.drop });
  }
  const gain = killReward(G.zone) * (z.boss ? BOSS_EVERY : 1) * rewardMult() * statOf('inc');
  G.parts += gain;
  G.totalKills++;
  addFloat(z.x, z.y - 30, '+' + fmt(gain), PALETTE.parts, 15);
  killIndex++;
  // M3 4.2 — 단계 클리어 일시금. 구역을 넘는 마지막 칸에서는 안 준다(그건 구역 클리어다).
  if (killIndex % stageKills(G.zone) === 0 && killIndex < zoneKills(G.zone)) {
    /* M3 5 — 설계도에도 **수입 능력치를 곱한다.** 안 곱했다가 후반에 진행이 막혔다:
       부품 경제는 수입 능력치(레벨당 1.12배, 30레벨이면 30배)로 커지는데 무기 값도 그 경제에 맞춰 커진다.
       설계도만 안 커지면 무기가 영영 안 잡힌다 — 3시드 격자에서 BP_RATIO 를 0.08→1.5 로 올려도
       구역 30 을 못 깼다(최고 구역 18→27). 양의 문제가 아니라 **성장률**의 문제였다. */
    questProgress('stage', 1);             // M4 1.2
    /* M6 2.1 — 단계 드랍은 없앴다(정본 '장비 드랍 없음', 지시 #121). 장비는 뽑기로만. */
    const bp = stageBlueprint(G.zone) * rewardMult() * statOf('inc');
    G.plans += bp;
    addFloat(GAME_W / 2, ARENA_TOP + 100, '단계 ' + currentStage() + ' / ' + STAGES_PER_ZONE
      + '   설계도 +' + fmt(bp), PALETTE.plans, 18);
  }
  if (z.boss) {
    const bp = bossBlueprint(G.zone) * rewardMult() * statOf('inc');
    G.plans += bp;
    addFloat(GAME_W / 2, ARENA_TOP + 130, '보스 · 설계도 +' + fmt(bp), PALETTE.plans, 18);
  }
  if (killIndex >= zoneKills(G.zone)) {   // M2: 벽 구역은 3배
    killIndex = 0;
    if (G.zone < ZONE_COUNT) {
      G.zone++;
      questProgress('zone', 1);            // M4 1.2
      G.bestZone = Math.max(G.bestZone, G.zone);
      addFloat(GAME_W / 2, ARENA_TOP + 60, '구역 ' + G.zone, PALETTE.gold, 26);
      zombies.length = 0; shots.length = 0;
    } else {
      addFloat(GAME_W / 2, ARENA_TOP + 60, '최종 구역 방어 중', PALETTE.gold, 20);
    }
  }
  G.kills = killIndex;
}

function stepCombat(dt) {

  /* 표적이 없다가 생기는 순간을 여기서 잡는다.
     스폰이 공격 판정보다 먼저 일어나므로, 아래에서 zombies.length 로 판단하면
     세션 첫 좀비와 부활 직후 첫 좀비가 공짜로 한 대 맞는다 (2026-09-08 5차 감사). */
  const hadTarget = zombies.length > 0;

  // 스폰 간격을 처치 시간에 맞춘다. 고정 간격이면 초반에 좀비가 쌓여 즉사한다 (WBS 8.1)
  spawnTimer -= dt;
  const ttk = zoneHP(G.zone) / Math.max(1e-6, playerDPS());
  const spawnGap = Math.min(2.0, Math.max(0.35, ttk * 0.9));
  const remaining = zoneKills(G.zone) - killIndex;   // M2: 벽 구역은 처치 수 x3
  if (spawnTimer <= 0 && zombies.length < Math.min(MAX_ONSCREEN_ZOMBIES, remaining)) {
    spawnZombie(); spawnTimer = spawnGap;
  }

  /* 좀비는 각자 '자기 줄 자리'로 걸어온다. 자리는 앞 좀비의 위치가 아니라
     접촉선에서 순번으로 계산한다. 예전에는 앞 좀비에 막히기만 하면 위치와 무관하게
     접촉으로 쳐서 **화면 밖 좀비가 피해를 줬다** (2026-09-08 실기 제보, 지시 #23).
     피해는 이제 '막혔는가'가 아니라 '접촉선 가까이 왔는가'로만 판정한다. */
  let contactDPS = 0;
  zombies.sort((a, b) => a.x - b.x);
  for (let i = 0; i < zombies.length; i++) {
    const z = zombies[i];
    // 보스 돌진 — 4초마다 0.8초 동안 3배로 밀고 들어온다
    if (z.boss) {
      if (z.charge > 0) z.charge -= dt;
      // 돌진 중에도 다음 주기를 센다. 안 그러면 주기가 4.0 이 아니라 4.8 이 된다
      // (2026-09-08 2차 감사에서 4.817초로 측정됨)
      z.nextCharge -= dt;
      if (z.nextCharge <= 0) { z.charge = BOSS_CHARGE_TIME; z.nextCharge = BOSS_CHARGE_EVERY; }
    }
    const spd = z.speed * (z.charge > 0 ? BOSS_CHARGE_MULT : 1);
    const stopX = CONTACT_X + i * ZOMBIE_GAP;          // 순번으로 정한 자기 자리
    if (z.x > stopX + 0.5) { z.x = Math.max(stopX, z.x - spd * dt); z.held = false; }
    else { z.x = stopX; z.held = true; }
    // 접촉선 가까이 온 좀비만 때린다. 위치로만 판정한다
    if (z.x <= CONTACT_X + CONTACT_REACH + 0.5) {
      contactDPS += zoneDPS(G.zone) * (z.boss ? 2 : 1);
    }
    if (z.flash > 0) z.flash -= dt;
    z.wob += dt * 7;
  }

  /* 표적이 없으면 공격 쿨다운을 채워 둔다.
     예전에는 표적이 없는 동안에도 타이머가 흘러 첫 좀비가 나타나자마자 공짜로 한 대 맞았다.
     그래서 단일 표적 처치 시간이 이론보다 33% 빨랐다 (2026-09-08 4차 감사).
     이제 표적이 생긴 뒤 한 주기를 다 기다린다. 지시 #25. */
  const interval = 1 / Math.max(0.05, attacksPerSec());
  if (!hadTarget) attackTimer = interval;   // 표적이 새로 생겼다. 한 주기를 다 기다린다
  else attackTimer -= dt;
  let guard = 0;
  while (attackTimer <= 0 && zombies.length && guard++ < 40) {
    attackTimer += interval;
    let target = null, best = 1e9;
    for (const z of zombies) { if (z.x < best) { best = z.x; target = z; } }
    /* 즉시 명중이다. 탄이 날아가는 동안 데미지가 미뤄지면
       표시 DPS 와 실제 DPS 가 어긋난다 (2026-09-08 2차 감사: -6.5%).
       기준을 낮추는 대신 구현을 고쳤다. 남는 것은 눈에 보이는 궤적뿐이다. */
    if (target) {
      shots.push({ x1: SURVIVOR_X + 30, y1: GROUND_Y - 34, x2: target.x, y2: target.y - 30, t: 0 });
      applyDamage(hitDamage());
    }
  }
  if (!zombies.length) attackTimer = interval;   // 다 죽였으면 다음 표적을 위해 채워 둔다

  for (let i = shots.length - 1; i >= 0; i--) {
    shots[i].t += dt;
    if (shots[i].t > 0.09) shots.splice(i, 1);
  }

  G.hp = Math.min(maxHP(), G.hp + regenPerSec() * dt - contactDPS * dt);
  if (contactDPS > 0) shake = Math.max(shake, 2);
  if (G.hp <= 0) onDeath();
  if (reviveOffer) {
    reviveOffer.t += dt;
    if (reviveOffer.t >= REVIVE_OFFER_SEC) reviveOffer = null;
  }

  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt; f.y -= 26 * dt;
    if (f.t > f.life) floats.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt;
    if (p.t > p.life) particles.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 12);
  if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - dt);
}

/* 쓰러지면 한 구역 물러나 계속 싸운다. 멈추지 않는다.
   물러난 구역은 이미 이겨본 곳이라 벌이가 되고, 그 벌이로 다시 올라간다 (지시 #35). */
function onDeath() {
  const from = G.zone;
  G.hp = maxHP();
  deathFlash = 1;
  zombies.length = 0; shots.length = 0;
  if (G.zone > 1) G.zone--;
  killIndex = 0; G.kills = 0;
  reviveOffer = { zone: from, t: 0 };
  addFloat(GAME_W / 2, ARENA_TOP + 60,
    G.zone < from ? '구역 ' + G.zone + ' 로 후퇴' : '버텼다', PALETTE.warn, 22);
  save();
}

/* 광고를 보면 죽은 그 구역으로 돌아간다. 안 보면 후퇴한 채로 계속 간다. */
function acceptRevive() {
  if (!reviveOffer) return false;
  G.zone = Math.min(ZONE_COUNT, reviveOffer.zone);
  G.bestZone = Math.max(G.bestZone, G.zone);
  G.hp = maxHP();
  killIndex = 0; G.kills = 0;
  zombies.length = 0; shots.length = 0;
  reviveOffer = null;
  addFloat(GAME_W / 2, ARENA_TOP + 60, '구역 ' + G.zone + ' 복귀', PALETTE.gold, 22);
  save();
  return true;
}

/* =========================================================================
   7. 오프라인 보상 — WBS 5
   ========================================================================= */

let offlineReport = null;

function partsPerSecondEstimate() {
  const ttk = zoneHP(G.zone) / Math.max(1e-6, playerDPS());
  /* 수입 능력치는 오프라인에도 똑같이 붙인다. 온라인만 붙이면 능력치를 올려도
     자리 비운 사이엔 안 늘어 플레이어가 이유를 알 수 없다.
     대가: 이미 방치가 활동보다 앞서는 문제(관측_오프라인지배)를 더 벌린다. 알고 넣는다. */
  return zoneReward(G.zone) * statOf('inc') / Math.max(ttk, 0.35);
}

function applyOffline() {
  const now = Date.now();
  const elapsed = Math.max(0, (now - (G.lastSeen || now)) / 1000);
  const capped = Math.min(elapsed, OFFLINE_MAX_HOURS * 3600);
  if (capped < 60) return null;
  const gain = partsPerSecondEstimate() * capped * OFFLINE_RATE;
  G.parts += gain;
  /* M3 5 — 설계도도 같이 쌓인다. 안 주면 자리를 비운 사이 무기만 멈춘다.
     비율은 부품 수입 대비 BP_RATIO 중 오프라인 몫(BP_OFFLINE_SHARE). */
  /* M6 2.1 — 오프라인 설계도는 없앴다(정본 '설계도 쓰임·출처': 단계 클리어·일일 과제에서만). plans 칸은 0 으로 남긴다(팝업 호환). */
  return { elapsed: elapsed, capped: capped, gain: gain, plans: 0, cappedHit: elapsed > capped + 1, doubled: false };
}

/* =========================================================================
   7.5 일일 리듬 — M4 1
   서버 없이 돈다. 날짜 번호는 **기기 시계의 로컬 자정** 기준이다.
   시계를 뒤로 돌리면 아무것도 안 준다 — maxDay 보다 작은 날은 무시한다.
   ========================================================================= */

function dayIndex(ts) {
  const d = new Date(ts);
  return Math.floor((ts - d.getTimezoneOffset() * 60000) / DAY_MS);
}

/* 그날 벌 수 있는 부품의 어림값. 일일 보상 총량을 여기에 묶는다 (WBS 1.4).
   현재 구역의 1분 수입 x 60 — 정확할 필요는 없고 **구역에 따라 같이 커지기만** 하면 된다. */
function dailyBudget() {
  return partsPerSecondEstimate() * 3600 * DAILY_BUDGET;
}

/* 하루가 바뀌었으면 일일 상태를 리셋한다. 돌아온 값은 화면에 띄울 것들. */
function rolloverDay() {
  const today = dayIndex(Date.now());
  if (today <= (G.maxDay || 0)) {          // 같은 날이거나 시계를 되돌렸다
    if (today > (G.day || 0)) G.day = today;
    return null;
  }
  const prev = G.login || { streak: 0, lastDay: -1 };
  const cont = prev.lastDay === today - 1;
  G.login = { streak: cont ? Math.min(LOGIN_DAYS, prev.streak + 1) : 1, lastDay: today };
  G.quest = { zone: 0, up: 0, stage: 0 };
  G.questTaken = {};
  G.keys = KEY_MAX;
  G.day = today;
  G.maxDay = today;
  /* 접속 보상 — 7일째가 가장 크다. 총량은 하루 예산 안에서 준다. */
  const w = LOGIN_SHARES[G.login.streak - 1] || LOGIN_SHARES[0];
  const gain = dailyBudget() * w;
  G.parts += gain;                              // M6 2.1: 접속 보상은 부품만 — 설계도는 과제·단계에서만
  save();
  return { kind: 'login', day: G.login.streak, gain: gain };
}

const RESET_CONFIRM_MS = 5000;
let resetArmAt = 0;
let resetting = false;                      // 켜지면 save() 가 아무것도 안 쓴다
function resetSave() {
  const now = performance.now();
  if (resetArmAt && now - resetArmAt < RESET_CONFIRM_MS) {
    resetting = true;                        // 먼저 저장을 막는다 — reload 전 틈에 자동 저장이 끼어들었다
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    G = freshState();                        // 메모리도 처음부터 (혹시 저장이 새어도 새 상태가 쓰인다)
    resetArmAt = 0;
    location.reload();                       // 처음부터 — 상태·화면을 통째로 새로 만든다
    return true;
  }
  resetArmAt = now;
  return false;
}
function questBand(hour) { return (hour >= QUEST_BANDS[2] || hour < QUEST_BANDS[0]) ? 2 : (hour >= QUEST_BANDS[1] ? 1 : 0); }
function questOpen(q) { return questBand(new Date().getHours()) === q.band; }   // M4 1.2 (a): 로컬 시각
function questProgress(id, n) {
  if (!G.quest) return;
  const q = QUEST_DEFS.find((x) => x.id === id);
  if (q && !questOpen(q)) return;          // M4 1.2 (a): 열린 시간대에만 센다
  G.quest[id] = (G.quest[id] || 0) + n;
}

function questReady(q) { return (G.quest && (G.quest[q.id] || 0) >= q.need) && !(G.questTaken || {})[q.id]; }

function takeQuest(id) {
  const q = QUEST_DEFS.find((x) => x.id === id);
  if (!q || !questReady(q)) return false;
  G.questTaken[id] = 1;
  const budget = dailyBudget();
  G.parts += budget * q.share;
  G.plans += budget * q.share * BP_RATIO;
  addFloat(GAME_W / 2, ARENA_TOP + 120, q.name + ' 완료', PALETTE.gold, 20);
  save();
  return true;
}

/* 보급 상자 — 하루 KEY_MAX 번. 열쇠가 없으면 안 열린다. */
function openSupply() {
  if ((G.keys || 0) <= 0) return false;
  G.keys -= 1;
  const budget = dailyBudget();
  const gain = budget * SUPPLY_SHARE / KEY_MAX;
  G.parts += gain;                              // M6 2.1: 상자도 부품만
  addFloat(GAME_W / 2, ARENA_TOP + 120, '보급 상자 +' + fmt(gain), PALETTE.gold, 20);
  save();
  return true;
}

/* =========================================================================
   8. 광고 자리 (스텁) — WBS 6
   실제 SDK는 M2. 지금은 버튼과 보상 경로만 만든다.
   ========================================================================= */

const adLog = [];
function adReward(kind) {
  adLog.push({ kind: kind, at: Date.now() });
  if (kind === 'boost') {
    G.boostUntil = Math.max(Date.now(), G.boostUntil || 0) + AD_BOOST_MIN * 60000;
    addFloat(GAME_W / 2, ARENA_TOP + 90, '부품 2배 ' + AD_BOOST_MIN + '분', PALETTE.gold, 22);
  } else if (kind === 'revive') {
    acceptRevive();
  } else if (kind === 'offline2x' && offlineReport && !offlineReport.doubled) {
    G.parts += offlineReport.gain;
    offlineReport.doubled = true;
  }
  save();
  return true;
}

/* =========================================================================
   9. UI — WBS 7
   ========================================================================= */

/* 업그레이드 패널 — 탭 2개에서 **하나의 스크롤 목록**으로 바꿨다 (지시 #46).
   왜: 탭을 전환해야 했으므로 "능력치·무기를 한 화면에서 다 만짐"(7.2)이 성립하지 않았고,
   목록 줄 높이가 44 라 작은 폰에서 탭 대상이 22.8 CSS px 로 판정선 29 에 못 미쳤다(7.1).
   줄을 58 로 키우면 11줄이 패널에 안 들어간다 — 그래서 스크롤한다.
   **11줄이 동시에 보이지는 않는다.** 사라진 것은 "모드 전환" 이지 "스크롤" 이 아니다. */
const ROW_H = 58;          // 58 x (280/540) = 30.07 CSS px — 판정선 29 위
/* 탭 대상의 최소 높이(CSS px). WBS 7.1 판정선.
   목록이 스크롤되면 위아래 끝에서 줄이 잘리는데, 잘린 줄이 이보다 얇으면 **눌리지 않는다.**
   15차 감사: 280x530 에서 1.04 CSS px 로 잘린 줄이 눌려 구매가 일어났다 (LG V30 은 28.67).
   온전한 줄은 폭 280 이상 어느 기기에서나 30.07 이라 이 규칙에 걸리지 않는다.
   16차 감사: 목록 밖의 고정 버튼(부활 제안 46 · 닫기 46 · 광고 2배 52)이 iPhone SE 폭에서 27.26 이었다.
   그래서 **탭 대상은 전부 ROW_H(58)** 다. 58 x 280/540 = 30.07 — 어느 폭에서도 판정선 위. */
const MIN_TAP_CSS = 29;
const ROW_GAP = 6;
const ROW_PITCH = ROW_H + ROW_GAP;
/* 탭으로 되돌렸다 (지시 #50). 지시 #46 에서 탭을 없앤 것은 판정 `7.2`("한 화면에서 다 만짐")를
   맞추려던 것인데, 그 문구가 **항목 수가 고정이라는 가정** 위에 있었다.
   구역·항목이 뒤로 계속 늘어날 예정이므로 평평한 목록 하나는 반드시 무너진다.
   사람이 판정 문구를 "탭 2회 이내로 살 수 있다" 로 바꿨고, 그래서 탭이 맞는 구조가 됐다.
   **스크롤·관성·잘라내기는 그대로 쓴다** — 버린 것은 "한 목록에 다 쌓기" 뿐이다. */
let tab = 'stat';
const buttons = [];
let listScroll = 0, listMax = 0;
/* 관성 스크롤. 손을 떼면 그 자리에 서는 것은 폰에서 쓰는 목록처럼 느껴지지 않는다
   (2026-09-10 실기 제보). 뗀 순간의 속도로 미끄러지다 마찰로 선다.
   FRICTION 6 이면 1초에 e^-6 ≈ 0.25% 로 줄어든다 — 약 0.6초 미끄러진다.
   세게 쓸면 끝까지 가고 살살 쓸면 조금만 간다. '한 번에 끝까지' 가 아니다. */
const LIST_FRICTION = 6;
const LIST_VEL_MAX = 4000;    // 논리 px/초. 이보다 빠른 손짓은 잘라낸다
const LIST_VEL_STOP = 20;     // 이보다 느려지면 세운다
let listVel = 0;
let holdBtn = null, holdTime = 0, holdRepeat = 0;
let drag = null;           // { y0, scroll0, moved, btn, samples }
const LIST_VEL_WINDOW = 90;   // ms. 이 안의 움직임만 보고 속도를 낸다

function tabRowY() { return PANEL_TOP; }
/* M5 2.4 — 장비 탭에서는 탭 줄 아래에 **장착 띠**(지금 낀 5부위, 가로 한 줄)가 고정으로 들어가고 목록은 그 아래서 시작한다.
   사람 제보 2026-09-18: "장비칸이 뭐가 착용되어 있는지 모르겠다 — 상단에 가로로 나열됐으면". 다른 탭은 그대로다. */
const EQUIP_STRIP_H = 96;
function listTopY() { return PANEL_TOP + ROW_H + 8 + (tab === 'gear' ? EQUIP_STRIP_H + 8 : 0); }
function adRowY() { return GAME_H - ROW_H - 10; }
function listBotY() { return adRowY() - 8; }

function btn(o) { buttons.push(o); return o; }

/* 일일 탭에 받을 것이 있으면 점을 찍는다 (M4 1). */
function dailyDot() {
  if ((G.keys || 0) > 0) return true;
  return QUEST_DEFS.some((q) => questReady(q));
}

function buyStat(id) {
  if (statDef(id).gearOnly) return false;   // M4 4.3 구조는 남긴다 — M6 1.1 부터 gearOnly 축은 없다
  if (statDef(id).cap != null && statOf(id) >= statDef(id).cap - 1e-9) return false;   // M6 1.2: 상한이면 못 산다
  const c = statCost(id);
  if (G.parts < c) return false;
  G.parts -= c; G.lv[id] = (G.lv[id] || 0) + 1;
  questProgress('up', 1);                  // M4 1.2
  return true;
}



function buildButtons() {
  buttons.length = 0;

  /* 오프라인 팝업이 떠 있으면 팝업 버튼만 만든다.
     뒤의 업그레이드 버튼을 살려두면 화면에 안 보이는 채로 눌려 몰래 구매된다.
     2026-09-08 실기 제보: "다른 곳을 아무리 터치해도 안 꺼지고 게임은 계속 진행된다" */
  /* M6 2.4 — 뽑기 결과 팝업. 오프라인 팝업과 같은 규칙: 떠 있으면 이 버튼들뿐이다 (뒤 버튼이 몰래 눌리면 안 된다, 지시 #19). */
  if (oddsPopup) {   // M6 3.2 — 확률 팝업. 같은 규칙.
    btn({ x: 0, y: 0, w: GAME_W, h: GAME_H, label: '', enabled: true, tone: 'scrim', onTap: () => { oddsPopup = false; return true; } });
    btn({ x: 150, y: GAME_H / 2 + 200, w: 240, h: ROW_H, label: '닫기', enabled: true, tone: 'ghost', onTap: () => { oddsPopup = false; return true; } });
    return;
  }
  if (gachaResult) {
    const undecided = gachaResult.mode === 'one' && !gachaResult.done;
    // 결정 전에는 배경을 눌러도 안 닫힌다 — 뽑은 것을 그냥 잃으면 안 된다
    btn({ x: 0, y: 0, w: GAME_W, h: GAME_H, label: '', enabled: true, tone: 'scrim', onTap: () => { if (undecided) return false; gachaResult = null; save(); return true; } });
    if (undecided) {
      btn({ x: 40,  y: GAME_H / 2 + 200, w: 220, h: ROW_H, label: '장착', enabled: true, tone: 'buy',   onTap: () => gachaDecide('equip') });
      btn({ x: 280, y: GAME_H / 2 + 200, w: 220, h: ROW_H, label: '판매 +' + fmt(gearSellPrice(gachaResult.g)), enabled: true, tone: 'ghost', onTap: () => gachaDecide('sell') });
    } else {
      btn({ x: 150, y: GAME_H / 2 + 200, w: 240, h: ROW_H, label: '닫기', enabled: true, tone: 'ghost', onTap: () => { gachaResult = null; save(); return true; } });
    }
    return;
  }
  if (offlineReport) {
    // 어두운 배경 아무 데나 눌러도 닫힌다 (사람이 가장 먼저 하는 행동이다)
    btn({ x: 0, y: 0, w: GAME_W, h: GAME_H, label: '', enabled: true, tone: 'scrim',
          onTap: () => { offlineReport = null; save(); return true; } });
    if (!offlineReport.doubled) {
      btn({ x: 90, y: GAME_H / 2 + 40, w: 360, h: ROW_H, label: '광고 보고 2배 받기', enabled: true, tone: 'ad',
            onTap: () => adReward('offline2x') });
    }
    btn({ x: 150, y: GAME_H / 2 + 108, w: 240, h: ROW_H, label: '닫기', enabled: true, tone: 'ghost',
          onTap: () => { offlineReport = null; save(); return true; } });
    return;
  }

  /* 탭 3개 (M4 1: 일일 추가). 높이를 ROW_H 로 맞춰 탭 대상 크기(7.1)를 지킨다.
     M4 3.4 에서 4개가 됐다. 폭 (540 - 24*2 - 간격 3칸) / 4 = 118.5 → 120, 간격 6.
     29 CSS px 선은 **높이**가 기준이라 안 바뀐다 — 다만 폭도 브라우저·격자로 확인한다. */
  const TW = 120, TG = 6;
  const mkTab = (i, id, label) => btn({ x: 24 + i * (TW + TG), y: tabRowY(), w: TW, h: ROW_H, label: label, icon: id,   // M5 1.3: 아이콘
        enabled: true, tone: tab === id ? 'on' : 'off',
        onTap: () => { if (tab !== id) { tab = id; listScroll = 0; listVel = 0; } return true; } });
  mkTab(0, 'stat', '능력치');
  mkTab(1, 'weapon', '무기');
  mkTab(2, 'gear', '장비');
  mkTab(3, 'daily', '일일' + (dailyDot() ? ' ●' : ''));

  const top = listTopY(), bot = listBotY(), clip = [top, bot];
  let cy = 0;                                   // 목록 안 좌표 (스크롤 전)

  const putRow = (o) => {
    const y = top + cy - listScroll;
    cy += ROW_PITCH;
    // 목록 밖으로 완전히 나간 줄은 만들지 않는다. 안 보이는 버튼이 눌리면 안 된다 (지시 #19)
    if (y + ROW_H < top || y > bot) return;
    o.x = 24; o.y = y; o.w = GAME_W - 48; o.h = ROW_H; o.clip = clip;
    btn(o);
  };

  if (tab === 'gear') {
    /* M5 2.4 — 위 장착 띠(drawEquipStrip)가 5부위를 보여주므로 부위 줄 5개는 뺐다 (그 줄들이 가방을 화면 아래로 밀어냈다).
       목록(M6 재설계 뒤): 합계 한 줄 → 뽑기 1회/10회 → 뽑기 강화 → 확률 보기. 가방·자동 판매 줄은 지시 #127 로 없어졌다. */
    const sums = AFFIX_DEFS.map((d) => [d.name, gearMult(d.id)]).filter((p) => p[1] > 1.0001)
      .map((p) => p[0] + ' +' + Math.round((p[1] - 1) * 100) + '%');
    putRow({ label: '장비 효과 합계', sub: sums.length ? sums.join('   ') : '낀 장비의 옵션이 여기 더해진다',
             cost: null, enabled: false, tone: 'ghost', icon: 'gear', onTap: () => false });
    /* M6 2.2 — 뽑기 줄. 값은 설계도. 10회는 10% 싸다. */
    [1, 10].forEach((n) => {
      const c = gachaCost(n);
      putRow({ label: '뽑기 ' + n + '회', sub: n === 1 ? '설계도로 5부위 중 하나 · 등급은 확률표' : '10개 한 번에 · 10% 싸다',
               cost: c, enabled: (G.plans || 0) >= c, tone: 'buy', icon: 'd:supply', costKind: 'plans',
               onTap: () => { if (!pullGacha(n)) { addFloat(GAME_W / 2, ARENA_TOP + 120, '설계도 부족 — ' + fmt(c - (G.plans || 0)) + ' 더', PALETTE.plans, 20); return false; } return true; } });
    });
    /* M6 3.1·3.2 — 뽑기 강화 줄(부품) · 확률 보기 줄(팝업) */
    {
      const lv = G.gachaLv || 0, maxed = lv >= GACHA_LV_MAX, uc = maxed ? null : gachaUpCost(lv);
      putRow({ label: '뽑기 강화  Lv.' + lv + (maxed ? '  최대' : ''),
               sub: maxed ? '영웅 이상 ' + oddsTop(lv).toFixed(1) + '%' : '영웅 이상 ' + oddsTop(lv).toFixed(1) + '%  ▸  ' + oddsTop(lv + 1).toFixed(1) + '%',
               cost: uc, enabled: !maxed && G.parts >= uc, tone: 'buy', icon: 's:crit', costKind: 'parts',
               onTap: () => upgradeGacha() });
      putRow({ label: '확률 보기', sub: '등급별 확률 · 지금 Lv.' + lv + (maxed ? '' : ' 과 다음 Lv.' + (lv + 1)),
               cost: null, enabled: true, tone: 'off', icon: 'd:quest', onTap: () => { oddsPopup = true; return true; } });
    }
  } else if (tab === 'daily') {
    // M4 1 — 접속 보상 상태 · 과제 3개 · 보급 상자
    putRow({ label: '접속 ' + ((G.login && G.login.streak) || 0) + ' / ' + LOGIN_DAYS + '일',
             sub: '자정에 하나씩. 하루 빠지면 처음부터', cost: null, enabled: false, tone: 'ghost', icon: 'd:login',
             onTap: () => false });
    QUEST_DEFS.forEach((q) => {
      const cur = Math.min(q.need, (G.quest && G.quest[q.id]) || 0);
      const taken = !!(G.questTaken || {})[q.id];
      const band = ['06~14시', '14~22시', '22~06시'][q.band] + (questOpen(q) ? ' 열림' : ' 닫힘');   // M4 1.2 (a)
      putRow({ label: q.name,
               sub: taken ? '받았다' : cur + ' / ' + q.need + '  · ' + band + (cur >= q.need ? '   눌러서 받기' : ''),
               cost: null, enabled: !taken && cur >= q.need,
               tone: taken ? 'ghost' : (cur >= q.need ? 'buy' : 'off'), icon: 'd:quest',
               onTap: () => takeQuest(q.id) });
    });
    putRow({ label: '보급 상자', sub: '열쇠 ' + (G.keys || 0) + ' / ' + KEY_MAX + '   자정에 채워진다',
             cost: null, enabled: (G.keys || 0) > 0, tone: (G.keys || 0) > 0 ? 'buy' : 'off', icon: 'd:supply',
             onTap: () => openSupply() });
    /* 테스트용 저장 지우기 (사람 요청 2026-09-17). 실수로 못 지우게 **5초 안에 두 번** 눌러야 한다.
       디자인이 끝나면 숨기거나 뺀다 — 그때 이 줄과 포트 거울(buildButtons)의 reset 행을 같이 지운다. */
    const armed = resetArmAt && (performance.now() - resetArmAt) < RESET_CONFIRM_MS;
    putRow({ label: '저장 지우기 (테스트)', sub: armed ? '정말? 5초 안에 한 번 더 누르면 처음부터' : '두 번 눌러야 지워진다',
             cost: null, enabled: true, tone: armed ? 'ad' : 'ghost', icon: 'd:reset', onTap: () => resetSave() });
  } else if (tab === 'stat') {
    STATS.filter((s) => !s.gearOnly).forEach((s) => {   // M4 4.3: 장비 전용 축은 줄이 없다
      const cost = statCost(s.id), val = statOf(s.id);
      const capped = s.cap != null && val >= s.cap - 1e-9;   // M6 1.2
      putRow({ label: s.name + '  Lv.' + (G.lv[s.id] || 0) + (capped ? '  최대' : ''),
               sub: statText(s.id, val) + (capped ? '' : '  ▸  ' + statText(s.id, statNext(s.id))),
               cost: capped ? null : cost, enabled: !capped && G.parts >= cost, tone: 'buy', icon: 's:' + s.id, costKind: 'parts',   // M5 2.1·2.2
               onTap: () => buyStat(s.id) });
    });
  } else {
    /* M6 2.3 — 무기 탭은 상점이 아니다. 낀 무기 한 줄 · 가방의 무기(값비싼 것부터, 탭하면 낀다) · 다음에 풀에 들어올 종류 한 줄.
       ★ 강화·해금 구매는 없어졌다 — 무기는 장비 탭에서 뽑는다. */
    const cw = curWeapon(), cwt = weaponOf(cw.type) || WEAPON_TYPES[0];
    putRow({ label: '낀 무기 · ' + gearName(cw), sub: '위력 ×' + weaponPower().toFixed(2) + (cw.affixes.length ? '   ' + cw.affixes.map((a) => affixText(a)).join('   ') : '') + '   ·   장비 탭에서 뽑는다',
             cost: null, enabled: false, tone: 'equipped', icon: 'w:' + cwt.shape, tint: tierColor(cw.tier), wid: cwt.id, onTap: () => false });
    /* M6 재설계 — 가방이 없으니 종류 10줄: 풀에 있는 것은 위력 배수, 아닌 것은 들어오는 구역. 누르는 줄이 아니다. */
    WEAPON_TYPES.forEach((w) => {
      const on = weaponUnlocked(w);
      putRow({ label: w.name, sub: on ? '뽑기 풀에 있음 · 종류 배수 ×' + w.mult.toFixed(2) : '구역 ' + w.unlock + ' 부터 뽑기에 나온다',
               cost: null, enabled: false, tone: 'ghost', icon: on ? 'w:' + w.shape : 'lock', wid: w.id, onTap: () => false });
    });
  }

  listMax = Math.max(0, cy - (bot - top));
  if (listScroll > listMax) { listScroll = listMax; }
  if (listScroll < 0) { listScroll = 0; }

  btn({ x: 24, y: adRowY(), w: GAME_W - 48, h: ROW_H,
        label: boostActive() ? '2배 ' + fmtTime((G.boostUntil - Date.now()) / 1000) : '광고 · 부품 2배',
        enabled: !boostActive(), tone: 'ad', onTap: () => adReward('boost') });

  /* 사망 제안. 전투 영역 아래쪽에 잠깐 떠 있다가 사라진다.
     화면을 막지 않는다 — scrim 도 없고 다른 버튼도 그대로 살아 있다. */
  if (reviveOffer) {
    btn({ x: 90, y: ARENA_BOT - 70, w: 360, h: ROW_H,
          label: '광고 보고 구역 ' + reviveOffer.zone + ' 복귀 · '
                 + Math.ceil(REVIVE_OFFER_SEC - reviveOffer.t) + '초',
          enabled: true, tone: 'ad', onTap: () => adReward('revive') });
  }
}

function hitButton(p) {
  const cssPer = cssW / GAME_W;              // 게임 좌표 1 이 CSS px 몇 개인지
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    // 목록 줄은 잘린 만큼만 눌린다. 잘려 나간 부분이 눌리면 안 보이는 것을 누르는 것이다
    const top = b.clip ? Math.max(b.y, b.clip[0]) : b.y;
    const bot = b.clip ? Math.min(b.y + b.h, b.clip[1]) : b.y + b.h;
    // 잘려서 판정선(MIN_TAP_CSS)보다 얇아진 줄은 탭 대상이 아니다.
    // 스치기만 해도 구매가 되던 구멍이다 (15차 감사). 온전한 줄은 그 줄 높이 그대로 받는다.
    if (b.clip && (bot - top) * cssPer < Math.min(MIN_TAP_CSS, b.h * cssPer) - 1e-9) continue;
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= top && p.y <= bot) return b;
  }
  return null;
}

/* =========================================================================
   10. 그리기
   ========================================================================= */

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  ctx.fillStyle = PALETTE.sky;
  ctx.fillRect(-8, -8, GAME_W + 16, GAME_H + 16);
  drawArena();
  drawHUD();
  drawPanelBg();
  if (tab === 'gear' && !offlineReport && !gachaResult && !oddsPopup) drawEquipStrip();   // M5 2.4
  if (deathFlash > 0) {
    ctx.fillStyle = 'rgba(' + PALETTE.deathRgb + ',' + (deathFlash * 0.35).toFixed(3) + ')';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
  }
  if (offlineReport) drawOffline();
  if (gachaResult) drawGachaResult();   // M6 2.4
  if (oddsPopup) drawOdds();            // M6 3.2
  // 버튼은 언제나 맨 위에 그린다. 오버레이가 자기 버튼을 덮으면 누를 수가 없다 (2026-09-08)
  drawButtons();
  ctx.restore();
}

/* M5 3.2 — 구역 색상. 전엔 205 - 구역x13 으로 전 스펙트럼을 돌아 파랑·초록·빨강이 다 나왔다.
   좀비 아포칼립스 톤으로 **올리브(90°) → 녹슨 갈색(15°)** 범위에 묶는다. 구역마다 2.6° 씩.
   8차 감사가 잡았던 "인접 구역 RGB 차이 1/255" 는 채도·명도를 구역마다 흔드는 것으로 막는다
   (적용 전 파이썬으로 30구역 인접 차이를 계산했다 — design-tone-2026-09-17.json). */
function zoneHue() { return 90 - (G.zone - 1) * 2.6; }
function drawArena() {
  // 구역마다 색이 눈에 띄게 달라야 한다 (검증자: 인접 구역 차이가 1/255 였다)
  ctx.fillStyle = 'hsl(' + zoneHue() + ',' + (6 + (G.zone * 2) % 50 * 0.6) + '%,'
    + (8 + (G.zone % 3) * 3) + '%)';
  ctx.fillRect(0, ARENA_TOP, GAME_W, ARENA_BOT - ARENA_TOP);

  /* 하늘 — 화면이 길어지면 전투 영역도 길어진다. 위를 비워두지 않는다. */
  const skyH = GROUND_Y - ARENA_TOP;
  const sky = ctx.createLinearGradient(0, ARENA_TOP, 0, GROUND_Y);
  /* 위쪽 밝기를 4% 로 고정했더니 색상만 달라져도 RGB 로는 구역 6·7 이 완전히 같았다
     (8차 감사). 화면이 길수록 이 영역이 전투 화면 대부분을 먹는다. 밝기도 구역마다 옮긴다. */
  sky.addColorStop(0, 'hsla(' + zoneHue() + ',' + (13 + (G.zone * 3) % 60 * 0.5) + '%,'
    + (6 + (G.zone % 4) * 4) + '%,1)');
  sky.addColorStop(1, 'hsla(' + zoneHue() + ',' + (7 + (G.zone * 3) % 60 * 0.5) + '%,'
    + (10 + (G.zone % 3) * 2) + '%,1)');
  ctx.fillStyle = sky;
  ctx.fillRect(0, ARENA_TOP, GAME_W, skyH);

  // M7 3.1 — 원경 두 겹을 8×8 타일(벽·창·지붕)로. 구역·크기마다 한 번 굽는다(bgLayers 캐시)
  { const bl = bgLayers(); ctx.imageSmoothingEnabled = false; ctx.drawImage(bl.build, 0, ARENA_TOP, GAME_W, bl.skyH); }
  // M5 3.2 — 비네트: 가장자리를 어둡게 해 시선을 가운데(생존자·좀비)로. 좀비 없는 상단이 넓어도 평평해 보이지 않는다
  // M5 4.1 — 그라데이션은 배치(GROUND_Y)가 같으면 다시 안 만든다
  if (!vignetteCache || vignetteCache.gy !== GROUND_Y) {
    const vg = ctx.createRadialGradient(GAME_W / 2, (ARENA_TOP + GROUND_Y) / 2, GAME_W * .25, GAME_W / 2, (ARENA_TOP + GROUND_Y) / 2, GAME_W * .85);
    vg.addColorStop(0, PALETTE.clear); vg.addColorStop(1, PALETTE.vignette);
    vignetteCache = { gy: GROUND_Y, vg: vg };
  }
  ctx.fillStyle = vignetteCache.vg; ctx.fillRect(0, ARENA_TOP, GAME_W, ARENA_BOT - ARENA_TOP);
  // M7 3.2 — 바닥 16×16 아스팔트 타일(맨 윗줄이 녹슨 바닥선). 캐시.
  { const bl = bgLayers(); ctx.imageSmoothingEnabled = false; ctx.drawImage(bl.ground, 0, GROUND_Y, GAME_W, bl.gh); }

  for (const zb of zombies) {
    const s = zb.boss ? 1.6 : 1;
    const bob = zb.held ? Math.sin(zb.wob * 1.6) * 1.5 : Math.sin(zb.wob) * 2;
    const fy = zb.y;                       // 발이 닿는 y
    // 그림자
    ctx.fillStyle = PALETTE.shade35;
    ctx.beginPath(); ctx.ellipse(zb.x, fy + 2, 14 * s, 4 * s, 0, 0, 6.284); ctx.fill();
    if (zb.boss && zb.charge > 0) {          // 돌진 중에는 뒤로 잔상을 남긴다
      ctx.fillStyle = PALETTE.bossGlow;
      ctx.fillRect(zb.x + 8 * s, fy - 46 * s, 30 * s, 44 * s);
    }
    // M7 2.2·2.3 — 도트. 걷기 2프레임(wob 로 박자), 피격은 flash 변형, 보스 돌진은 blood 램프. body 색은 안 쓴다(변형 범례가 대신)
    const frame = (Math.floor(zb.wob * 1.2) % 2) ? 'walk2' : 'walk1';
    const variant = zb.flash > 0 ? 'flash' : (zb.boss && zb.charge > 0 ? 'blood' : zombieBand(G.zone));
    if (zb.boss) drawPx(sprite('boss', frame, variant), zb.x - 12 * PX, fy - 32 * PX + bob, false);
    else drawPx(sprite('zombie', frame, variant), zb.x - 6 * PX, fy - 16 * PX + bob, false);
    const w = 34 * s, pct = Math.max(0, zb.hp / zb.max);
    ctx.fillStyle = PALETTE.shade55;
    ctx.fillRect(zb.x - w / 2, fy - 66 * s + bob, w, 4);
    ctx.fillStyle = zb.boss ? PALETTE.gold : PALETTE.danger;
    ctx.fillRect(zb.x - w / 2, fy - 66 * s + bob, w * pct, 4);
  }

  ctx.strokeStyle = weaponTint();
  ctx.lineWidth = 2;
  for (const s of shots) {
    ctx.globalAlpha = Math.max(0, 1 - s.t / 0.09);
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  {
    const w = weaponOf(curWeapon().type) || WEAPON_TYPES[0];
    const wt = weaponTint();
    const x = SURVIVOR_X, fy = GROUND_Y;
    ctx.fillStyle = PALETTE.shade35;
    ctx.beginPath(); ctx.ellipse(x, fy + 2, 15, 4, 0, 0, 6.284); ctx.fill();
    // M7 2.1 — 생존자 도트(12×16, 픽셀 3px = 36×48). 숨 쉬기 2프레임. 오른쪽을 본다.
    drawPx(sprite('survivor', shots.length ? 'shoot' : ((Math.floor(performance.now() / 500) % 2) ? 'idle2' : 'idle')), x - 6 * PX, fy - 16 * PX, false);
    ctx.fillStyle = wt;
    if (w.shape === 'wide')      ctx.fillRect(x + 12, fy - 38, 26, 9);
    else if (w.shape === 'long') ctx.fillRect(x + 12, fy - 36, 34, 5);
    else if (w.shape === 'disc') { ctx.beginPath(); ctx.arc(x + 24, fy - 32, 8, 0, 6.284); ctx.fill(); }
    else if (w.shape === 'cross'){ ctx.fillRect(x + 12, fy - 36, 24, 5); ctx.fillRect(x + 20, fy - 44, 5, 20); }
    /* 화염방사기. 2026-09-09 14차 감사: 'nozzle' 이 어느 분기에도 안 걸려
       쇠파이프와 **같은 사각형**으로 그려지고 있었다 — 모양이 6종이 아니라 5종이었다. */
    else if (w.shape === 'nozzle'){ ctx.fillRect(x + 12, fy - 35, 18, 5);
                                    ctx.fillRect(x + 28, fy - 39, 8, 13); }
    // M2 무기 4종 — 모양만 다르다. 디자인은 마지막(지시 #36)
    else if (w.shape === 'twin')  { ctx.fillRect(x + 12, fy - 38, 30, 4); ctx.fillRect(x + 12, fy - 32, 30, 4); ctx.fillRect(x + 10, fy - 40, 6, 14); }
    else if (w.shape === 'launcher') { ctx.fillRect(x + 12, fy - 40, 26, 11); ctx.fillRect(x + 36, fy - 43, 6, 17); }
    else if (w.shape === 'saw')   { ctx.fillRect(x + 12, fy - 36, 24, 6); for (let i = 0; i < 5; i++) ctx.fillRect(x + 14 + i * 5, fy - 40, 3, 4); }
    else if (w.shape === 'rail')  { ctx.fillRect(x + 12, fy - 35, 38, 3); ctx.fillRect(x + 20, fy - 39, 4, 11); ctx.fillRect(x + 34, fy - 39, 4, 11); }
    else                          ctx.fillRect(x + 12, fy - 34, 20, 6);
  }

  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
    ctx.fillStyle = f.c;
    ctx.font = '600 ' + f.s + 'px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = PALETTE.panel;
  ctx.fillRect(0, 0, GAME_W, ARENA_TOP);
  ctx.strokeStyle = PALETTE.rustSoft;      // M5 3.2 — HUD 와 전투의 경계도 녹 빛
  ctx.beginPath(); ctx.moveTo(0, ARENA_TOP - .5); ctx.lineTo(GAME_W, ARENA_TOP - .5); ctx.stroke();

  /* M5 3.1 — 재화 둘을 아이콘과 **한 줄**에. 라벨은 위, 숫자는 같은 기준선(54).
     설계도는 부품 숫자 오른쪽에 금색으로 — 다른 재화라는 것이 색·아이콘·자리로 보인다.
     (실기 2026-09-17 의 "설계도 글씨가 막대에 가려짐" 은 막대를 72 로 내려 이미 풀렸다 — 여기서도 68 아래엔 글씨가 없다) */
  ctx.textAlign = 'left';
  ctx.font = '600 26px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  const partsTxt = fmt(G.parts), partsW = ctx.measureText(partsTxt).width;
  const plansX = 48 + partsW + 22;
  ctx.font = '600 11px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillStyle = PALETTE.parts;  ctx.fillText('부품', 24, 26);
  ctx.fillStyle = PALETTE.plans;  ctx.fillText('설계도', plansX, 26);
  drawIcon('c:parts', 33, 45, 18, PALETTE.parts);
  ctx.fillStyle = PALETTE.ink;
  ctx.font = '600 26px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText(partsTxt, 48, 54);
  drawIcon('c:plans', plansX + 8, 45, 14, PALETTE.plans);
  ctx.fillStyle = PALETTE.plans;   // M3 5: 설계도 — 무기 전용 재화
  ctx.font = '600 18px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText(fmt(G.plans), plansX + 20, 54);

  ctx.textAlign = 'right';
  ctx.fillStyle = PALETTE.parts;
  ctx.font = '600 11px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText('구역', GAME_W - 24, 26);
  ctx.fillStyle = PALETTE.ink;
  ctx.font = '600 26px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText(G.zone + ' / ' + ZONE_COUNT, GAME_W - 24, 54);
  ctx.fillStyle = PALETTE.parts;
  ctx.font = '600 11px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  ctx.fillText(currentStage() + ' / ' + STAGES_PER_ZONE + ' 단계', GAME_W - 24, 68);

  const px = 24, pw = GAME_W - 48;
  // M3 4.1 — 진행 막대를 단계 수만큼 쪼갠다. 한 칸이 한 단계다.
  const segW = (pw - (STAGES_PER_ZONE - 1) * 3) / STAGES_PER_ZONE;
  const stKills = stageKills(G.zone);
  for (let i = 0; i < STAGES_PER_ZONE; i++) {
    const x = px + i * (segW + 3);
    ctx.fillStyle = PALETTE.track;
    ctx.fillRect(x, 72, segW, 4);
    const doneInSeg = Math.max(0, Math.min(stKills, killIndex - i * stKills));
    if (doneInSeg > 0) {
      ctx.fillStyle = PALETTE.parts;
      ctx.fillRect(x, 72, segW * (doneInSeg / stKills), 4);
    }
  }

  const hpPct = Math.max(0, G.hp / maxHP());
  ctx.fillStyle = PALETTE.track;
  ctx.fillRect(px, 79, pw, 8);
  ctx.fillStyle = hpPct > .3 ? PALETTE.hpOk : PALETTE.danger;
  ctx.fillRect(px, 79, pw * hpPct, 8);
  ctx.textAlign = 'center';
  ctx.fillStyle = (saveError || loadError) ? PALETTE.warn : PALETTE.ink2;
  ctx.font = '600 11px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
  // maxWidth 를 줘서 긴 오류 문구가 화면 밖으로 넘치지 않게 한다
  ctx.fillText(saveError ? '저장 실패 — 진행이 남지 않는다'
    : loadError ? loadError
    : '체력 ' + fmt(G.hp) + ' / ' + fmt(maxHP()) + '     DPS ' + fmt(playerDPS())
      + (boostActive() ? '     부품 2배' : '')
      + (focusActive() ? '     집중' : (focusReady() ? '     탭!' : '')), GAME_W / 2, 98, GAME_W - 48);
}

function drawPanelBg() {
  ctx.fillStyle = PALETTE.panel;
  ctx.fillRect(0, ARENA_BOT, GAME_W, GAME_H - ARENA_BOT);
  ctx.strokeStyle = PALETTE.rustSoft;      // M5 3.2 — 전투와 패널의 경계도 녹 빛
  ctx.beginPath(); ctx.moveTo(0, ARENA_BOT + .5); ctx.lineTo(GAME_W, ARENA_BOT + .5); ctx.stroke();

  if (offlineReport || gachaResult || oddsPopup) return;
  const top = listTopY(), bot = listBotY();

  /* M5 1.2 — 영역이 어디서 시작하고 끝나는지 보이게 (사람 제보 2026-09-17: "메뉴 간 분간이 안 된다").
     탭 줄과 광고 줄은 밝은 띠(panel2), 목록은 가장 어두운 바탕(panel0). 경계마다 1px 선. */
  ctx.fillStyle = PALETTE.panel2;
  ctx.fillRect(0, PANEL_TOP, GAME_W, top - 4 - PANEL_TOP);          // 탭 띠
  ctx.fillRect(0, adRowY() - 6, GAME_W, GAME_H - (adRowY() - 6));   // 광고 띠
  ctx.fillStyle = PALETTE.panel0;
  ctx.fillRect(0, top - 4, GAME_W, (bot + 4) - (top - 4));            // 목록 바탕
  ctx.strokeStyle = PALETTE.edge; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, top - 4 + .5); ctx.lineTo(GAME_W, top - 4 + .5);      // 탭 띠 ↔ 목록
  ctx.moveTo(0, bot + 4 + .5); ctx.lineTo(GAME_W, bot + 4 + .5);      // 목록 ↔ 광고 띠
  ctx.stroke();

  // 스크롤 막대 — 탭 이름이 구역을 말해주므로 목록 안 제목은 없앴다 — 더 있다는 것을 알려준다
  if (listMax > 0) {
    const trackH = bot - top;
    const barH = Math.max(24, trackH * trackH / (trackH + listMax));
    const barY = top + (trackH - barH) * (listScroll / listMax);
    ctx.fillStyle = PALETTE.scrollTrack;
    ctx.fillRect(GAME_W - 10, top, 4, trackH);
    ctx.fillStyle = PALETTE.scrollThumb;
    ctx.fillRect(GAME_W - 10, barY, 4, barH);
  }
}

/* M5 1.3 — 단색 아이콘. 글자 없이도 무엇인지 알게 한다 (사람 제보: "메뉴가 텍스트뿐이라 가시성이 안 좋다").
   canvas 경로만 쓴다 — 이모지는 기기마다 모양·색이 달라 통일감이 깨진다. 크기 s 는 한 변. */
/* M5 4.1 — 아이콘 캐시. 한 프레임에 아이콘이 20개 넘게 그려지고 전부 경로(arc·stroke)라,
   폰(DPR 4)에서 매 프레임 다시 그리면 fps 가 샌다. (종류, 크기, 색, DPR) 마다 한 번만 그려 두고 drawImage 로 찍는다.
   본체 drawIconPath 는 그대로 — 캐시는 그 결과를 저장할 뿐 모양을 바꾸지 않는다. */
/* ── M7 1.2 도트 그래픽 기반 (지시 #132) ──
   격자 규격: 캐릭터 12×16 · 아이콘 8×8 · 타일 16×16 · 보스 24×32 · 무기 부품 4×8. 픽셀 한 칸 = 논리 PX(3)px — 자산마다 곱게/거칠게 그리지 않는다.
   문자열 격자 → 1px=1칸 오프스크린 캔버스에 한 번 찍고(캐시), 그릴 때 PX 배로 늘린다(imageSmoothingEnabled=false → 계단이 살아 있다).
   범례 색은 PALETTE.ramp 에서만(c26 이 본다). '.' 과 ' ' 은 빈칸. */
const PX = 3;
const PX_GRIDS = [[12, 16], [8, 8], [16, 16], [24, 32], [4, 8]];
const pxCache = new Map();
function pxSprite(name, rows, legend) {
  let c = pxCache.get(name);
  if (c) return c;
  const h = rows.length, w = rows[0].length;
  if (!PX_GRIDS.some((g) => g[0] === w && g[1] === h)) console.warn('도트 격자 규격 밖: ' + name + ' ' + w + 'x' + h);
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const col = legend[ch]; if (!col) { console.warn('범례 없는 글자 ' + ch + ' in ' + name); continue; }
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  pxCache.set(name, c);
  return c;
}
function drawPx(spr, x, y, flip) {   // (x, y) = 왼쪽 위 논리 좌표. flip 이면 좌우 반전
  ctx.imageSmoothingEnabled = false;
  const w = spr.width * PX, h = spr.height * PX;
  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(spr, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(spr, x, y, w, h);
}
/* 도트 자산 표 — 범례는 PALETTE.ramp 참조만. 새 자산은 여기 줄을 더한다(코드가 아니라 데이터). */

    frames: {

        '..OSSSSSSO..',
        '..OSSSESEO..',
        '..OsSSSSsO..',
        '...OSSSSO...',
        '..OJJjjJJO..',
        '.OJJJjjJJJO.',
        '.OkJJJJJJkO.',
        '.OkJJJJJJkO.',
        '..OPPPPPPO..',
        '..OPP..PPO..',
        '..OPP..PPO..',
        '..OBB..BBO..',
        '..OOO..OOO..'],
      idle2: [
        '............',
        '....OOOO....',
        '...OHHHHO...',
        '..OHHHHHHO..',
        '..OSSSSSSO..',

/* 좀비 — 왼쪽을 보고 팔을 앞으로. 구역에 따라 램프를 바꾼다(정본 "좀비 스프라이트 재사용, 구역별 색 변형"):
   구역 1~7 올리브 · 8~15 콘크리트 · 16~23 녹 · 24~30 피. 보스는 같은 격자를 2배(24×32) — 픽셀 크기는 같다. */
SPRITES.zombie = {
  legend: { O: R.olive[3], Z: R.olive[1], z: R.olive[2], E: R.blood[1], T: R.concrete[2], t: R.concrete[3], P: R.concrete[1], B: R.rust[2] },
  frames: {

/* M5 2.4 — 장착 띠. 지금 낀 5부위를 가로 한 줄로 (사람 제보 2026-09-18: "장비칸이 뭐가 착용되어 있는지 직관적으로 알고 싶다").
   칸마다: 아이콘(등급 색) · 등급(무기는 ★레벨) · 부위/무기 이름. 비면 점선. 가방에 더 좋은 것이 있으면 오른쪽 위 ▲.
   누르는 대상이 아니다 — 누르는 곳은 목록의 가방 줄. 그래서 tap_check 의 대상도 아니다. */
function drawEquipStrip() {
  const y = tabRowY() + ROW_H + 8, h = EQUIP_STRIP_H, gap = 8;
  const w = (GAME_W - 48 - gap * (GEAR_SLOTS.length - 1)) / GEAR_SLOTS.length;
  GEAR_SLOTS.forEach((sl, i) => {

    const has = isW ? !!wp : !!g;
    const tint = !has ? PALETTE.dim2 : tierColor(isW ? curWeapon().tier : g.tier);   // M5 2.5 — 등급 색 (M6 2.3: 무기도 장비 등급)
    ctx.fillStyle = has ? PALETTE.equippedBg : PALETTE.ghostBg; rr(x, y, w, h, 8); ctx.fill();
    ctx.strokeStyle = has ? tint : PALETTE.edgeSoft; ctx.lineWidth = has ? 1.5 : 1;
    if (!has) ctx.setLineDash([4, 4]);
    rr(x + .5, y + .5, w - 1, h - 1, 8); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
    drawIcon(isW ? (wp ? 'w:' + wp.shape : 'g:weapon') : 'g:' + sl.id, x + w / 2, y + 30, 30, tint);
    ctx.textAlign = 'center';

    ctx.font = '400 11px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
    ctx.fillStyle = PALETTE.ink3;
    ctx.fillText(isW ? (wp ? wp.name : '무기') : sl.name, x + w / 2, y + 82);
  });
}

function drawButtons() {
  for (const b of buttons) {
    if (b.tone === 'scrim') continue;   // 배경 닫기 영역은 그리지 않는다
    if (b.clip) { ctx.save(); ctx.beginPath(); ctx.rect(0, b.clip[0], GAME_W, b.clip[1] - b.clip[0]); ctx.clip(); }
    let bg = PALETTE.rowBg, fg = PALETTE.ink, bd = PALETTE.btnLine;
    // M5 1.3 — 탭(icon 이 있는 버튼): 선택은 채운 배경+밝은 글자, 나머지는 낮춘 명도. 자리·크기는 그대로.
    if (b.tone === 'on') { bg = b.icon ? PALETTE.tabOn : PALETTE.onBg; fg = b.icon ? PALETTE.tabOnInk : fg; bd = PALETTE.parts; }
    else if (b.tone === 'off') { bg = b.icon ? PALETTE.tabOff : bg; fg = b.icon ? PALETTE.tabOffInk : PALETTE.muted; bd = b.icon ? PALETTE.edgeSoft : bd; }
    else if (b.tone === 'ad') { bg = PALETTE.adBg; bd = PALETTE.gold; fg = PALETTE.goldInk; }
    else if (b.tone === 'equipped') { bg = PALETTE.equippedBg; bd = PALETTE.parts; }
    else if (b.tone === 'ghost') { bg = PALETTE.ghostBg; fg = PALETTE.ink2; }
    // M5 2.3 — 살 수 있는 줄(buy, 눌림)은 청록 테두리·살짝 밝은 바탕. 탭은 위에서 따로.
    if (b.tone === 'buy' && b.enabled !== false) { bg = PALETTE.buyBg; bd = PALETTE.buyBd; }
    if (b.enabled === false) { fg = PALETTE.dim; bd = PALETTE.btnLineDim; bg = PALETTE.disabledBg; }

    // M7 4.2 — 도트 패널: 라운드 최소, 위 하이라이트·아래 섀도 1px(광원 위). 자리·크기는 그대로(c16·tap_check)
    ctx.fillStyle = bg; rr(b.x, b.y, b.w, b.h, 2); ctx.fill();
    ctx.strokeStyle = bd; ctx.lineWidth = 1; rr(b.x + .5, b.y + .5, b.w - 1, b.h - 1, 2); ctx.stroke();
    ctx.fillStyle = PALETTE.btnLine; ctx.fillRect(b.x + 2, b.y + 1, b.w - 4, 1);
    ctx.fillStyle = PALETTE.shade55; ctx.fillRect(b.x + 2, b.y + b.h - 2, b.w - 4, 1);
    if (b.tint) { ctx.fillStyle = b.tint; rr(b.x + 8, b.y + 8, 6, b.h - 16, 3); ctx.fill(); }

    // M5 2.2 — 목록 줄(sub 가 있는 줄)은 왼쪽에 아이콘. 등급 띠(tint)가 있으면 그 오른쪽에.
    const rowIcon = b.sub && b.icon;
    const ix = b.x + (b.tint ? 22 : 14) + 11;
    if (rowIcon) drawIcon(b.icon, ix, b.y + b.h / 2, 22, b.enabled === false ? PALETTE.dim2 : (b.tone === 'ghost' ? PALETTE.ink3 : fg));
    const tx = b.x + (b.tint ? 22 : 14) + (rowIcon ? 30 : 0);
    ctx.fillStyle = fg;
    ctx.font = '600 15px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
    if (b.sub) {
      ctx.textAlign = 'left';
      ctx.fillText(b.label, tx, b.y + b.h / 2 - 2);
      ctx.fillStyle = b.enabled === false ? PALETTE.dim2 : PALETTE.ink3;
      ctx.font = '400 12px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
      ctx.fillText(b.sub, tx, b.y + b.h / 2 + 15);
    } else if (b.icon) {
      // 아이콘 + 글자를 한 덩이로 가운데 맞춘다
      ctx.font = '600 15px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
      const tw = ctx.measureText(b.label).width, iw = 18, gap = 7;
      const x0 = b.x + (b.w - (iw + gap + tw)) / 2;
      drawIcon(b.icon, x0 + iw / 2, b.y + b.h / 2, iw, fg);
      ctx.textAlign = 'left';
      ctx.fillText(b.label, x0 + iw + gap, b.y + b.h / 2 + 5);
    } else {
      ctx.textAlign = 'center';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 5);
    }

    if (b.cost != null) {
      // M5 2.1 — 값은 재화 색 + 재화 아이콘. 부품 청록, 설계도 금색 (전엔 둘 다 금색이라 구분이 안 됐다 — 지시 #111)
      const kind = b.costKind === 'plans' ? 'c:plans' : 'c:parts';
      const col = b.enabled === false ? PALETTE.dim : (kind === 'c:plans' ? PALETTE.plans : PALETTE.parts);
      ctx.textAlign = 'right';
      ctx.fillStyle = col;
      ctx.font = '600 14px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
      const cs = fmt(b.cost), cw = ctx.measureText(cs).width;
      ctx.fillText(cs, b.x + b.w - 14, b.y + b.h / 2 + 5);
      drawIcon(kind, b.x + b.w - 14 - cw - 12, b.y + b.h / 2, 14, col);
    }
    if (b.clip) ctx.restore();
  }
}

/* =========================================================================
   11. 게임 루프 — WBS 1.2
   delta time 기반. 탭 전환 등으로 큰 간격이 생기면 잘라낸다.
   ========================================================================= */

/* 프레임률과 무관하게 같은 속도로 돈다.
   예전에는 dt 를 0.05 로 잘라버려서 10fps 기기에서 게임이 절반 속도로 흘렀다
   (2026-09-08 검증자 적발). 이제 남는 시간을 모아 1/60 씩 여러 번 돌린다. */
const FIXED_STEP = 1 / 60;
const MAX_STEPS = 30;      /* 한 프레임에 따라잡을 최대 횟수.
     MAX_GAP(0.5초) 을 1/60 로 나눈 값이라 4fps 에서도 정확히 따라잡는다.
     12 였을 때는 4fps 에서 60초가 48초로 흘렀다 (2026-09-09 6차 감사). */
const MAX_GAP = 0.5;       // 탭 전환 등 큰 공백은 여기서 자른다. 나머지는 오프라인 보상이 맡는다
let last = 0, saveTimer = 0, acc = 0;

function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > MAX_GAP) dt = MAX_GAP;
  if (dt < 0) dt = 0;

  if (!offlineReport) {
    acc += dt;
    let steps = 0;
    while (acc >= FIXED_STEP && steps < MAX_STEPS) {
      stepCombat(FIXED_STEP); acc -= FIXED_STEP; steps++;
    }
    if (steps >= MAX_STEPS) acc = 0;   // 못 따라잡으면 버린다. 무한 누적을 막는다
  } else {
    acc = 0;
  }

  // 길게 누르기 연속 구매 — WBS 3.4
  if (holdBtn) {
    holdTime += dt;
    if (holdTime > 0.3) {
      holdRepeat += dt;
      // 3초 안에 100회를 넘겨야 한다 (2026-09-08 검증자 적발: 93회였다)
      const rate = holdTime > 1.2 ? 0.015 : 0.08;
      let guard = 0;
      while (holdRepeat >= rate && guard++ < 40) {
        holdRepeat -= rate;
        if (!holdBtn.onTap()) { holdBtn = null; break; }
      }
    }
  }

  // 관성 스크롤 — 손을 뗀 뒤 마찰로 선다
  if (listVel !== 0 && !drag) {
    listScroll += listVel * dt;
    if (listScroll <= 0) { listScroll = 0; listVel = 0; }
    else if (listScroll >= listMax) { listScroll = listMax; listVel = 0; }
    else {
      listVel *= Math.exp(-LIST_FRICTION * dt);
      if (Math.abs(listVel) < LIST_VEL_STOP) listVel = 0;
    }
  }

  saveTimer += dt;
  if (saveTimer > 30) { saveTimer = 0; save(); }

  buildButtons();
  draw();
  requestAnimationFrame(frame);
}

/* ========================= 입력 ========================= */

/* 목록 줄은 **누르는 순간 사지 않는다.** 끌면 스크롤이고, 안 끌고 떼면 구매다.
   누르는 순간 사면 스크롤하려다 매번 하나씩 사게 된다.
   길게 눌러 연속 구매하는 것(3.4)은 그대로다 — holdBtn 을 여기서 잡아두고
   0.3초 뒤부터 frame() 의 반복이 산다. */
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const p = toCanvas(e.clientX, e.clientY);
  const b = hitButton(p);
  const inList = p.y >= listTopY() && p.y <= listBotY() && !offlineReport && !gachaResult && !oddsPopup;

  if (inList) {
    listVel = 0;                       // 미끄러지는 중에 짚으면 그 자리에 선다
    drag = { y0: p.y, scroll0: listScroll, moved: false,
             btn: (b && b.enabled !== false) ? b : null,
             samples: [{ y: p.y, t: performance.now() }] };
    holdBtn = (drag.btn && drag.btn.tone === 'buy') ? drag.btn : null;
    holdTime = 0; holdRepeat = 0;
    return;
  }

  /* M4 2 — 버튼이 아닌 전투 영역을 탭하면 집중 사격. 팝업이 떠 있으면 안 한다. */
  if (!b && !offlineReport && !gachaResult && !oddsPopup && !reviveOffer && p.y >= ARENA_TOP && p.y <= ARENA_BOT) {
    if (triggerFocus()) buildButtons();
    return;
  }
  if (!b || b.enabled === false) return;
  b.onTap();
  buildButtons();
  const again = hitButton(p);
  holdBtn = (again && again.tone === 'buy' && again.enabled !== false) ? again : null;
  holdTime = 0; holdRepeat = 0;
  save();
});

canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  e.preventDefault();
  const p = toCanvas(e.clientX, e.clientY);
  const dy = p.y - drag.y0;
  if (!drag.moved && Math.abs(dy) > 6) { drag.moved = true; holdBtn = null; }
  if (drag.moved) {
    listScroll = Math.max(0, Math.min(listMax, drag.scroll0 - dy));
    /* 뗄 때 쓸 속도는 **최근 90ms 창**의 움직임으로만 낸다.
       옛 속도를 비율로 섞으면 끌다 멈춘 뒤 떼도 그 30% 가 남아 미끄러진다
       (2026-09-10, 넣자마자 브라우저 시험으로 잡았다 — 36px 미끄러졌다). */
    const now = performance.now();
    drag.samples.push({ y: p.y, t: now });
    while (drag.samples.length > 2 && now - drag.samples[0].t > LIST_VEL_WINDOW) drag.samples.shift();
    buildButtons();
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) {
    const now = performance.now();
    const sm = d.samples;
    while (sm.length > 2 && now - sm[0].t > LIST_VEL_WINDOW) sm.shift();
    let v = 0;
    const span = (sm[sm.length - 1].t - sm[0].t) / 1000;
    // 창 안에 실제 움직임이 있을 때만 속도가 있다. 멈춘 채로 뗐으면 0 이다
    if (sm.length >= 2 && span > 0.005 && now - sm[sm.length - 1].t <= LIST_VEL_WINDOW) {
      v = -(sm[sm.length - 1].y - sm[0].y) / span;
    }
    listVel = Math.max(-LIST_VEL_MAX, Math.min(LIST_VEL_MAX, v));
    if (Math.abs(listVel) < LIST_VEL_STOP) listVel = 0;
  }
  if (d.moved || !d.btn) return;
  // 끌지 않고 뗐다 = 구매
  if (holdTime <= 0.3) { d.btn.onTap(); buildButtons(); save(); }
});
/* 정리. **pointerup 에서는 listVel 을 지우지 않는다** — 바로 위에서 방금 넣은 관성 속도를
   지워버려서 손을 떼면 그 자리에 서 있었다 (2026-09-10, 넣자마자 브라우저 시험으로 잡았다).
   취소·이탈은 "손짓이 무효가 된 것" 이므로 그때는 지운다. */
canvas.addEventListener('pointerup', () => { holdBtn = null; drag = null; });
['pointercancel', 'pointerleave'].forEach(ev =>
  canvas.addEventListener(ev, () => { holdBtn = null; drag = null; listVel = 0; }));

window.addEventListener('resize', fitGame);
window.addEventListener('orientationchange', () => setTimeout(fitGame, 80));
document.addEventListener('fullscreenchange', fitGame);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ========================= 시작 ========================= */

function start() {
  fitGame();
  const had = load();
  if (had) offlineReport = applyOffline();
  if (!(G.hp > 0)) G.hp = maxHP();
  killIndex = G.kills || 0;
  buildButtons();
  save();
  requestAnimationFrame(frame);
}

/* 시작이 실패하면 그 자리에서 보인다. 조용히 까만 화면으로 남기지 않는다. */
try {
  start();
  window.__gameLoaded = true;
} catch (err) {
  fatal('start() 에서 멈췄다 — ' + (err && err.stack ? err.stack : err));
}
</script>
