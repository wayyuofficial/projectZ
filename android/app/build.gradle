plugins { id 'com.android.application' }

android {
    namespace 'com.wayyu.zombiesurvival'
    compileSdk 34

    defaultConfig {
        applicationId "com.wayyu.zombiesurvival"
        minSdk 24            // Android 7.0. LG V30(Android 8~9)을 덮는다
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets {
        main {
            // 게임 파일을 복사하지 않는다. 저장소의 game/ 폴더를 그대로 가리킨다.
            // 복사본을 두면 원본과 갈라진다 (지시 #17 충돌 처리).
            assets.srcDirs = ['src/main/assets', '../../game']
        }
    }

    androidResources {
        // game/README.md 는 개발용 문서다. 앱에 넣지 않는다.
        ignoreAssetsPattern '!.svn:!.git:!.gitignore:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!README.md'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 서명 설정 없음 -> Android Studio 의 Build > Generate Signed Bundle/APK 로 서명한다.
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 의존성 없음.
// WebView 하나짜리 앱에 androidx.appcompat 을 넣었더니 kotlin-stdlib 1.8.22 와
// kotlin-stdlib-jdk7/jdk8 1.6.21 이 겹쳐 빌드가 깨졌다 (2026-09-08).
// 프레임워크 Activity 와 프레임워크 테마만 쓰면 그 문제가 통째로 사라지고 APK 도 작아진다.
dependencies { }
